<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>备考助手 · 预开发版原型　AI 通用备考　三端自适应</title>
<meta name="description" content="备考助手：AI 通用备考产品三端自适应原型，学员端 35 页、机构端 16 页、平台后台 19 页。">
<style>

:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--sunk:#F5F7FA;--ink:#1A2130;--ink2:#465064;--ink3:#687287;--line:#D9DEE6;--line2:#E8ECF1;
  --pri:#2E4A8E;--pri-ink:#1F3366;--pri-soft:#E6EBF6;
  --amber:#9A6206;--amber-soft:#FBF0D9;--amber-line:#E5C78A;
  --red:#B23E2E;--red-soft:#FBE7E3;--green:#23775A;--green-soft:#DFF0E8;--violet:#5E4497;--violet-soft:#EEE9F7;
  --m0:#E3E7EC;--m1:#D2EBE1;--m2:#A9D8C5;--m3:#72BC9F;--m4:#35957A;--m5:#18664F;
  --r:10px;--rs:7px;
  --sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink);background:#D7DCE4;display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* 原型工具条：不属于产品 */
.pbar{flex:none;display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;background:#131925;color:#E5E9F0;overflow-x:auto;scrollbar-width:none}
.pbar .pname{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.14em;white-space:nowrap}
.pbar .pname small{font-family:var(--sans);font-weight:400;font-size:11.5px;letter-spacing:0;color:#8F9BB0;margin-left:8px}
.seg{display:flex;background:#222B3A;border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;color:#AEB8C8;padding:4px 10px;border-radius:6px;font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#E5E9F0;color:#131925;font-weight:600}
.pbar .sp{flex:1}
.pbtn{border:1px solid #364256;background:none;color:#E5E9F0;border-radius:8px;padding:4px 10px;font-size:12.5px;white-space:nowrap;flex:none}
.pbtn[aria-pressed=true]{background:#E5E9F0;color:#131925;border-color:#E5E9F0}
@media (max-width:900px){.pbar .pname small,#devSeg{display:none}}
@media (max-width:480px){.pbar .pname{display:none}.seg button{padding:4px 7px}}

/* 舞台与设备预览 */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;position:relative;overflow:hidden;transition:padding .2s ease}
body:not([data-dev=auto]) .stage{padding:16px;overflow:auto;align-items:flex-start}
.stage.pushed{padding-right:420px}
body:not([data-dev=auto]) .stage.pushed{padding-right:436px}
.frame{container-type:inline-size;container-name:app;position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
body[data-dev=desk] .frame{width:1280px;max-width:100%;height:100%;border-radius:12px;border:1px solid #BCC4D0;flex:none}
body[data-dev=pad] .frame{width:834px;max-width:100%;height:min(100%,1112px);border-radius:22px;border:10px solid #1B2230;flex:none}
body[data-dev=phone] .frame{width:390px;max-width:100%;height:min(100%,844px);border-radius:36px;border:10px solid #1B2230;flex:none}

/* 应用外壳 */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
.side{grid-row:1/3;background:#F9FAFC;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:50}
.brand{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line2)}
.brand b{font-family:var(--serif);font-size:21px;letter-spacing:.16em;color:var(--pri-ink)}
.brand span{font-size:12px;color:var(--ink3);white-space:nowrap}
.nav{flex:1;overflow:auto;padding:6px 10px 16px;scrollbar-width:thin}
.ng{margin-top:10px}
.ng .gl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);padding:4px 8px}
.ng .gi{display:none;width:44px;height:44px;margin:0 auto;border:0;border-radius:10px;background:none;color:var(--ink2);font-size:15px;font-weight:600;place-items:center}
.ng .gi[aria-current=true]{background:var(--pri-soft);color:var(--pri-ink)}
.ng a{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:7px;color:var(--ink2);font-size:13.5px;text-decoration:none}
.ng a em{font-style:normal;font-size:11px;color:var(--violet);margin-left:auto;border:1px solid #D8CDEC;border-radius:4px;padding:0 4px;line-height:1.5}
.ng a:hover{background:#EEF1F6}
.ng a[aria-current=page]{background:var(--pri-soft);color:var(--pri-ink);font-weight:600}
.side-foot{flex:none;padding:12px 14px;border-top:1px solid var(--line2);display:flex;gap:10px;align-items:center;font-size:12.5px;line-height:1.35}
.side-foot b{display:block;font-size:13px}
.side-foot span{color:var(--ink3)}
.ava{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;font-size:13px}
.top{display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.top .sp{flex:1}
.crumb{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.crumb small{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.crumb b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topx{display:flex;align-items:center;gap:8px;flex:none}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);position:relative;flex:none;padding:0}
.ib .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.menu{display:none;font-size:16px}
.goal{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px 4px 6px;font-size:12.5px;white-space:nowrap}
.goal b{background:var(--pri);color:#fff;border-radius:999px;padding:1px 9px;font-weight:600}
.goal em{font-style:normal;color:var(--ink3)}
.main{overflow:auto;padding:22px 24px 48px;min-width:0;position:relative;scroll-behavior:smooth}
.tabsbar{display:none}
.fab{position:absolute;right:20px;bottom:20px;z-index:40;height:44px;padding:0 16px 0 12px;border-radius:22px;border:0;background:var(--pri-ink);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(20,35,80,.28)}
.fab::before{content:"";width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9FB4E8 0 30%,#5B79C8 31% 60%,transparent 61%)}
.app.test~.fab,.app.noai~.fab{display:none}
.scrim{position:absolute;inset:0;background:rgba(12,18,32,.36);z-index:45;display:none}
.scrim.on{display:block}
.flyout{position:absolute;left:72px;top:60px;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,55,.16);padding:8px;z-index:56;display:none}
.flyout.on{display:block}
.flyout h4{font-size:12px;color:var(--ink3);font-weight:500;padding:4px 8px}
.flyout a{display:flex;gap:8px;padding:7px 8px;border-radius:7px;color:var(--ink2);text-decoration:none;font-size:13.5px}
.flyout a em{font-style:normal;font-size:11px;color:var(--violet);margin-left:auto}
.flyout a:hover{background:var(--sunk)}
.pop{position:absolute;top:58px;right:14px;width:300px;max-width:calc(100% - 28px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,55,.16);padding:10px;z-index:58;display:none}
.pop.on{display:block}
.pop button.it{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px}
.pop button.it:hover{background:var(--sunk)}
.pop button.it small{color:var(--ink3)}

/* 平板：图标列 */
@container app (max-width:1023px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .brand{padding:0;justify-content:center}
  .brand span{display:none}
  .ng{margin-top:4px}
  .ng .gl,.ng a{display:none}
  .ng .gi{display:grid}
  .side-foot{justify-content:center}
  .side-foot div{display:none}
  .main{padding:18px 18px 40px}
}
/* 手机：抽屉＋底部标签 */
@container app (max-width:699px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) auto}
  .side{position:absolute;top:0;left:0;bottom:0;width:min(300px,86%);transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 28px rgba(15,25,45,.2)}
  .side.open{transform:none}
  .brand{justify-content:flex-start;padding:0 18px}
  .brand span{display:inline}
  .ng{margin-top:10px}
  .ng .gl{display:flex}
  .ng a{display:flex}
  .ng .gi{display:none}
  .side-foot{justify-content:flex-start}
  .side-foot div{display:block}
  .menu{display:grid}
  .top{padding:0 10px;gap:8px}
  .crumb small{display:none}
  .goal em,.goal .gx{display:none}
  .topx .wide{display:none}
  .main{padding:14px 14px 28px}
  .tabsbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tabsbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--ink3);font-size:11.5px;text-decoration:none;border-radius:8px}
  .tabsbar a b{width:22px;height:22px;border-radius:7px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px}
  .tabsbar a[aria-current=page]{color:var(--pri)}
  .tabsbar a[aria-current=page] b{background:var(--pri);border-color:var(--pri);color:#fff}
  .app.immersive{grid-template-rows:52px minmax(0,1fr)}
  .app.immersive .tabsbar{display:none}
  .fab{right:14px;bottom:76px;padding:0 12px;height:40px}
  .app.immersive~.fab{bottom:16px}
  .flyout{display:none!important}
}

/* 抽屉 */
.tutor{position:absolute;top:0;right:0;bottom:0;width:384px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s ease}
.tutor.open{transform:none}
@container app (max-width:699px){
  .tutor{top:auto;height:86%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(102%)}
  .tutor.open{transform:none}
}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2);flex:none}
.dh h2{font-size:15px;flex:1}
.db{flex:1;overflow:auto;padding:14px 16px}
.spec{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;background:#FBFCFD;border-left:1px solid #C6CEDA;z-index:80;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
.spec.open{transform:none}
.spec-b{flex:1;overflow:auto;padding:16px 18px 40px;font-size:13px}
.spec-b .sid{display:inline-block;font-size:12px;color:var(--pri);border:1px solid #C3CEE6;border-radius:5px;padding:0 6px;margin-bottom:6px}
.spec-b h3{font-size:18px;margin-bottom:6px}
.spec-b h4{font-size:12.5px;color:var(--ink3);font-weight:600;margin:16px 0 6px}
.spec-b .why0{color:var(--ink2)}
.spec-t{width:100%;border-collapse:collapse}
.spec-t td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.spec-t td:last-child{text-align:right;padding-left:8px;white-space:nowrap}
.spec-t b{display:block;font-weight:600}
.spec-t span{color:var(--ink3)}
.spec-b .ups a{display:inline-block;margin:0 6px 6px 0;padding:2px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;text-decoration:none}
.mapov{position:fixed;inset:0;z-index:200;background:rgba(14,20,32,.55);display:none;padding:28px}
.mapov.on{display:flex;justify-content:center}
.mapov .in{background:var(--surface);border-radius:14px;width:min(1100px,100%);display:flex;flex-direction:column;overflow:hidden}
.mapov header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mapov header h2{font-size:16px}
.mapov .body{overflow:auto;padding:16px 18px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.mapov .grp h4{font-size:12.5px;color:var(--ink3);margin:0 0 6px}
.mapov .grp a{display:flex;gap:8px;padding:5px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px}
.mapov .grp a:hover{background:var(--sunk)}
.mapov .grp a i{font-style:normal;color:var(--pri);font-size:12px;width:30px;flex:none}
.mapov .grp a small{color:var(--ink3);margin-left:auto;font-size:11.5px;text-align:right}
@media (max-width:640px){.mapov{padding:0}.mapov .in{border-radius:0}}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1A2130;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:all .18s ease;z-index:300;max-width:min(560px,90%);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 页面元素 */
.phd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-bottom:18px;flex-wrap:wrap}
.phd h1{font-size:22px;font-weight:700;letter-spacing:.01em}
.phd p{color:var(--ink3);font-size:13px;margin-top:4px;max-width:68ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.g{display:grid;gap:16px;margin-bottom:16px}
.g>*{min-width:0}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.c11{grid-template-columns:1fr 1fr}
@container app (max-width:1023px){.c3,.c4{grid-template-columns:1fr 1fr}.c21,.c12{grid-template-columns:minmax(0,1fr)}}
@container app (max-width:699px){.c2,.c3,.c11{grid-template-columns:minmax(0,1fr)}.c4{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.ph h3{font-size:15px;font-weight:600}
.ph .sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.ph .pr{flex:none;font-size:12.5px;display:flex;gap:8px;align-items:center}
.pn.hero{background:var(--pri-ink);border-color:var(--pri-ink);color:#EEF2FA}
.pn.hero .mut,.pn.hero .why,.pn.hero .ph .sub{color:#B7C3DD}
.pn.hero .why::before{color:#DDE5F7;border-color:#5C72A8}
.pn.flat{background:var(--sunk);border-color:var(--line2)}
.pn.warm{background:var(--amber-soft);border-color:var(--amber-line)}
.mut{color:var(--ink3);font-size:12.5px}
.sm{font-size:12.5px}
.b{font-weight:600}
.mt{margin-top:10px}.mt2{margin-top:16px}.mb{margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;white-space:nowrap;color:var(--ink);line-height:1.4}
.btn:hover{border-color:#B9C2CF}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--pri)}
.btn.warn{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:9px 18px;font-size:14.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pn.hero .btn{border-color:#5C72A8;background:transparent;color:#fff}
.pn.hero .btn.pri{background:#fff;color:var(--pri-ink);border-color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:0 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap;vertical-align:1px}
.tag.pri{background:var(--pri-soft);color:var(--pri-ink);border-color:#CDD7EE}
.tag.green{background:var(--green-soft);color:var(--green);border-color:#BFE0D1}
.tag.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.tag.red{background:var(--red-soft);color:var(--red);border-color:#EFC3BB}
.tag.violet{background:var(--violet-soft);color:var(--violet);border-color:#D8CDEC}
.tag.ink{background:#2A3346;color:#E8ECF3;border-color:#2A3346}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--pri-soft);border-color:#A9B9E0;color:var(--pri-ink);font-weight:600}
.segc{display:inline-flex;background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:13px;color:var(--ink2)}
.segc button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.pane{display:none}.pane.on{display:block}
.why{font-size:12.5px;color:var(--ink2);margin-top:4px}
.why::before{content:"为什么是它";font-size:11px;color:var(--pri);border:1px solid #C8D3EC;border-radius:4px;padding:0 4px;margin-right:6px}
.note{border-left:3px solid var(--pri);background:var(--pri-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink)}
.note.amber{border-color:#C48A1E;background:var(--amber-soft)}
.note.red{border-color:var(--red);background:var(--red-soft)}
.note.green{border-color:var(--green);background:var(--green-soft)}
.note.ink{border-color:#2A3346;background:#EEF0F4}
.prop{border:1.5px dashed #C9A050;background:var(--amber-soft);border-radius:9px;padding:11px 12px}
.prop .pt{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rows>li{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.rows>li:first-child{padding-top:2px}
.rows>li:last-child{border-bottom:0;padding-bottom:2px}
.rows .t{font-weight:600}
.rows .m{font-size:12.5px;color:var(--ink3)}
.rows .rt{flex:none;display:flex;gap:6px;align-items:center}
.rows>li.done .t{color:var(--ink3);text-decoration:line-through}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #AEB7C5;flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;color:transparent}
li.done .ck{background:var(--green);border-color:var(--green);color:#fff}
li.doing .ck{border-color:var(--pri);box-shadow:inset 0 0 0 4px var(--pri-soft)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:13.5px}
.kv dt{color:var(--ink3)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}

.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}

.lm{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.lm i{height:9px;border-radius:5px;background:var(--m0);display:block}.lm i.f1{background:var(--m1)}.lm i.f2{background:var(--m2)}.lm i.f3{background:var(--m3)}.lm i.f4{background:var(--m4)}.lm i.f5{background:var(--m5)}.lm i.t{outline:2px solid #C48A1E;outline-offset:1px}

.axis{display:flex;gap:3px;border-radius:9px;overflow:hidden}

.tl{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden}
.tl i{display:block;height:100%}
.wk{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:3px;font-size:11.5px}
.wk>span{color:var(--ink3);display:flex;align-items:center}
.wk>b{font-weight:500;color:var(--ink3);text-align:center}

.opts button{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;margin-bottom:8px;line-height:1.55}

.opts button.ok{border-color:var(--green);background:var(--green-soft)}
.opts button.bad{border-color:var(--red);background:var(--red-soft)}
.opts button.ok b{background:var(--green);border-color:var(--green);color:#fff}
.opts button.bad b{background:var(--red);border-color:var(--red);color:#fff}
.q .reveal{display:none}

.qstem{font-size:15.5px;line-height:1.75;margin:6px 0 14px}

.rv.flipped .flip{display:none}

.book{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;font-size:15px;line-height:1.95}

.seltb{display:inline-flex;flex-wrap:wrap;gap:2px;background:#1B2333;border-radius:9px;padding:4px;margin:6px 0 2px}

.band{width:100%;height:auto;display:block}

/* ===== 组件与页面样式 ===== */
:root{--hl:#FFE36E;--ai:#5E4497}
/* 原型工具条补充 */
.psel{background:#222B3A;color:#E5E9F0;border:1px solid #364256;border-radius:8px;padding:4px 8px;font-size:12.5px;max-width:230px;flex:none}
.psel:focus-visible{outline:2px solid #9FB4E8}
.plab{font-size:11.5px;color:#8F9BB0;white-space:nowrap;flex:none}
.pnote{flex:none;display:none;align-items:center;gap:10px;padding:6px 14px;background:#2A3243;color:#DCE3EE;font-size:12.5px;line-height:1.5}
.pnote.on{display:flex}
.pnote b{color:#FFE36E;font-weight:600;flex:none}
.pnote span{flex:1;min-width:0}
.pnote button{flex:none;border:1px solid #4A5670;background:none;color:#DCE3EE;border-radius:6px;padding:1px 8px;font-size:12px}
@media (max-width:1180px){.plab{display:none}}
@media (max-width:760px){#scSel{max-width:120px}#stSel{max-width:96px}}

/* 侧栏分组字徽：与平板图标列、手机底栏同一套图形 */
.bub{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid #9AA6BA;font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1}
.ng.cur .gl .bub{background:var(--pri);border-color:var(--pri);color:#fff}
.ng .gl{font-weight:600}
.ng a{padding-left:38px}
.ng a[aria-current=page]{box-shadow:inset 3px 0 0 var(--pri)}
.ng .gi{width:62px;height:auto;padding:6px 0 5px;display:none;flex-direction:column;gap:3px;align-items:center;font-size:11px;font-weight:500;color:var(--ink3);border-radius:10px}
.ng .gi .bub{width:28px;height:28px;font-size:13px}
.ng .gi[aria-current=true]{background:var(--pri-soft);color:var(--pri-ink)}
.ng .gi[aria-current=true] .bub{background:var(--pri);border-color:var(--pri);color:#fff}
@container app (max-width:1023px){.ng .gi{display:flex}}
@container app (max-width:699px){.ng .gi{display:none}}

/* 顶栏补充 */
.ib.cap{font-size:18px;font-weight:600;line-height:1}
.goal{cursor:pointer}
.goal span{font-variant-numeric:tabular-nums}
.flowh{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.flowh .mark{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.12em;color:var(--pri-ink);flex:none}
.flowh .stepper{margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.flowh .stepper span{white-space:nowrap}
@container app (max-width:699px){.flowh .stepper span:not(.on){display:none}.flowh .mark{display:none}}

/* 三种页面档位 */
.app.flow,.app.solo{grid-template-columns:minmax(0,1fr)}
.app.flow .side,.app.solo .side,.app.flow .tabsbar,.app.solo .tabsbar{display:none!important}
.app.flow .main,.app.solo .main{padding-bottom:40px}
.app.solo .top{justify-content:center}
.app.immersive{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
.app.immersive .side,.app.immersive .top,.app.immersive .tabsbar{display:none!important}
.app.immersive .main{padding:0 0 40px;background:#F3F5F8}
.app.immersive .main>.sess{padding:16px 22px 0}
@container app (max-width:699px){.app.immersive .main>.sess{padding:12px 12px 0}}
.sessbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:#1E2738;color:#E6EBF3;padding:9px 18px;font-size:13px}
.sessbar .btn{background:transparent;border-color:#46536D;color:#E6EBF3}
.sessbar .btn.pri{background:#fff;color:var(--pri-ink);border-color:#fff}
.sessbar b{font-size:14px}
.sessbar .num{font-variant-numeric:tabular-nums}
.sessbar .tag{background:#2E3A52;border-color:#46536D;color:#DCE3EF}
.sessbar .sp{flex:1}
.sessbar.test{background:#141B28}
@container app (max-width:699px){.sessbar{padding:8px 12px;gap:6px 10px}.sessbar .wide{display:none}}

/* 题号点 */
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdots button{width:24px;height:24px;border-radius:50%;border:1px solid #56637E;background:none;color:#C9D2E2;font-size:11px;padding:0;font-variant-numeric:tabular-nums}
.qdots button.ok{background:#2F7D62;border-color:#2F7D62;color:#fff}
.qdots button.bad{background:#B85444;border-color:#B85444;color:#fff}
.qdots button.cur{background:#fff;color:#1E2738;border-color:#fff;font-weight:700}
.qdots button.mk{box-shadow:0 0 0 2px #E4B44C}

/* 把握度：三档带副标签，“不会”单列 */
.conf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;text-align:left;line-height:1.35;min-height:44px}
.conf button b{display:block;font-size:13.5px}
.conf button small{font-size:11.5px;color:var(--ink3)}
.conf button[aria-pressed=true]{border-color:var(--pri);background:var(--pri-soft)}
.conf button.dunno{border-style:dashed;color:var(--ink2)}
@container app (max-width:699px){.conf{grid-template-columns:1fr 1fr}.conf .dunno{grid-column:1/3}}

/* 掌握方格：按章分行，格内写档位数字 */
.mgrid{display:flex;flex-direction:column;gap:7px}
.mrow{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) max-content;gap:10px;align-items:start;font-size:12.5px}
.mrow>span:first-child{color:var(--ink2);line-height:1.35;padding-top:1px}
.mrow>em{font-style:normal;color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
.cells.num i{width:17px;height:17px;border-radius:4px;font-style:normal;font-size:9.5px;line-height:17px;text-align:center;color:#3E5D51;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.cells.num i.l4,.cells.num i.l5{color:#fff}
.cells.num i.q{line-height:14px;color:#6B778C}
.cells.num i.x{color:transparent}
.cells.num i.sel{outline:2px solid var(--pri);outline-offset:1px}
.cells.dim i{filter:grayscale(1);opacity:.55}
@container app (max-width:699px){.mrow{grid-template-columns:minmax(0,1fr) max-content}.mrow .cells{grid-column:1/3}.cells.num i{width:19px;height:19px;line-height:19px}}

/* 提议卡：虚线框，固定四行 */
.prop{background:#FCF4E2}
.prop .pt .tag{font-weight:500}
.prop dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:13px;margin:8px 0 2px}
.prop dt{color:var(--amber);font-size:12.5px}
.prop dd{margin:0}
/* 撤销条 */
.undo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);background:var(--sunk);border-radius:9px;padding:9px 12px;font-size:13px}
.undo .grow b{display:block;font-size:13px}
.undo .grow span{color:var(--ink3);font-size:12.5px}
/* AI 标识 */
.ai{display:inline-flex;align-items:center;font-size:11px;line-height:1.5;color:var(--violet);border:1px solid #D3C7EA;background:#F7F4FC;border-radius:4px;padding:0 5px;vertical-align:1px;white-space:nowrap}
/* 锁定态 */

 return `<div class="solo-w">${head(p?'平台后台登录':'机构端登录',p?'员工账号与学员账号完全分开：入口、会话与审计各自独立。登录后进入运营驾驶舱。':'机构员工账号与学员账号分开，登录后进入机构工作台。')}${pn('',`<div class="stack" style="gap:10px"><label class="field"><span>${p?'工作邮箱':'员工账号'}</span><input class="inp" placeholder="${p?'name@company.com':'手机号或工号'}"></label><label class="field"><span>密码</span><input class="inp" type="password" placeholder="输入密码"></label><label class="field"><span>${p?'二次验证码':'二次验证码（机构要求时需要）'}</span><input class="inp" inputmode="numeric" placeholder="验证器里的动态码"></label>${act('登录','pri lg','stafflogin',`data-p="${id}"`)}${p?'':btn('用单点登录','','','跳转到机构的统一身份认证')}<p class="mut sm">${p?'连续输错会锁定一段时间；同一账号只保留一个在线会话，新登录会让旧会话下线；密码到期须先改密才能继续；离职或停用后，账号与全部会话立即失效。':'连续输错会锁定一段时间；离职或停用后，账号与全部会话立即失效。机构可以要求二次验证、只保留一个会话、定期改密，只能在平台基线上收紧，不能放宽。'}</p></div>`)}<p class="mut mt">退出登录或会话失效（超时、被新登录挤下线、账号停用）后，都回到这一页。</p></div>`}
Object.assign(ACT,{stafflogin(t){const id=t.dataset.p;ST.v[id]='main';location.hash=id==='P19'?'P01':'O01';toast(id==='P19'?'已登录，进入运营驾驶舱':'已登录，进入机构工作台')}});
{const p19=PAGES.P19,o15=PAGES.O15;
 PAGES.P19=()=>V('P19')==='login'?pdvStaffLogin('P19'):p19();
 PAGES.O15=()=>V('O15')==='login'?pdvStaffLogin('O15'):o15();}

boot();
</script>
