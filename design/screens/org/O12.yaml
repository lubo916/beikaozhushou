title: 结业、认证与续报
mode: standard
purpose: 交付要有收口。培训机构关心结课与续报，企业关心认证与复训，学校关心学期成绩；三者都在回答“这一段学完了，然后呢”。
states: [loading, empty, error, offline, restricted, insufficient_data]
