  - id: O12-01
    name: 学员数据带走
    text: 退班或结课后学员保留全部个人学习数据
    page_priority: P0
  - id: O12-02
    name: 结课报告
    text: 每个学员的阶段成果：达标进度与成绩变化；老师审阅后下发
    page_priority: P1
  - id: O12-03
    name: 结业条件
    text: 必修完成、考试通过、出勤达标等条件可配置
    page_priority: P1
  - id: O12-04
    name: 证书
    text: 结业与认证证书的模板、发放与验真
    page_priority: P1
  - id: O12-05
    name: 认证有效期与复训
    text: 证书到期前提醒，自动指派复训任务
    page_priority: P1
  - id: O12-06
    name: 续报与下一阶段推荐
    text: 按学员进度推荐下一班型；不使用督学数据做营销
    page_priority: P1
  - id: O12-07
    name: 成绩回收
    text: 考后收集真实成绩，只用于改进教学与校准，不用于宣传
    page_priority: P1
  - id: O12-08
    name: 满意度回访
    text: 结课问卷与回访记录
    page_priority: P2
