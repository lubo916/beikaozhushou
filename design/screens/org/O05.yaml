title: 排课、考勤与直播
mode: standard
purpose: 排课冲突和考勤统计是教务最耗时的两件事；课表还决定学员今日任务里“几点上课”。
states: [loading, empty, error, offline, restricted, insufficient_data]
data:
  writes: [课表与考勤（属机构任务数据）]
ai:
  - role: 排课建议与冲突消解。
entries: []
exits: []
unresolved_links: [O06, O11]
items:
  - id: O05-01
    name: 课表进入学员今日
    text: 上课时间占用当天的时间预算，个人任务自动避让
    page_priority: P0
  - id: O05-02
    name: 课表编排
    text: 按班级、老师、教室或直播间排课；周视图与日视图
    page_priority: P1
  - id: O05-03
    name: 冲突检测
    text: 老师、教室、学员时间冲突即时提示，并给可行的时段
    page_priority: P1
  - id: O05-04
    name: 调课、代课与停课
    text: 一键通知受影响学员，学员侧计划自动避让
    page_priority: P1
  - id: O05-05
    name: 考勤
    text: 面授签到、直播到课、请假与缺勤；缺勤计入机构任务数据
    page_priority: P1
  - id: O05-06
    name: 学期与批次
    text: 学校按学期与课程表，企业按培训批次，机构按期次
    page_priority: P1
  - id: O05-07
    name: 随堂答题
    text: 讲到某个知识点时推题，结果记为学员证据
    page_priority: P1
  - id: O05-08
    name: 课堂看板
    text: 实时看到谁没跟上、哪道题全班错
    page_priority: P1
  - id: O05-09
    name: 回放切片
    text: 按知识点切段并挂到知识地图
    page_priority: P1
  - id: O05-10
    name: 课后小测自动布置
    text: 下课后按本节知识点生成小测，老师确认后下发
    page_priority: P1
  - id: O05-11
    name: 到课与专注统计
    text: 到课、中途离开；不做摄像头监控
    page_priority: P1
  - id: O05-12
    name: 老师课时统计
    text: 课时、代课与工作量汇总
    page_priority: P2
  - id: O05-13
    name: 教室与资源
    text: 教室、设备、直播间的占用
    page_priority: P2
  - id: O05-14
    name: 直播开课
    text: 排课后一键开播；支持连麦、白板、课件
    page_priority: P2
  - id: O05-15
    name: 面授课堂模式
    text: 老师投屏推题，学员用手机作答
    page_priority: P2
  - id: O05-16
    name: 讲义与板书同步
    text: 同步到学员的笔记本
    page_priority: P2
