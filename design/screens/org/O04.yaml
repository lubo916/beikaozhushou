# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: O04
end: org
title: 学员 360°
mode: standard
purpose: 老师联系学员之前，要在一页里看清他的情况，也要看清自己被允许看到什么。
states: [loading, empty, error, offline, restricted, insufficient_data]
data:
  reads: [按授权范围读取]
  notes: [查看敏感字段留痕]
ai:
  - role: 生成沟通要点与阶段报告草稿。
entries: [O01, O03, O08]
exits: []
items:
  - id: O04-01
    name: 可见范围说明
    text: 页面顶部按四类数据列出当前能看到什么、看不到什么
    page_priority: P0
  - id: O04-02
    name: 学情摘要
    text: 预测区间、薄弱章节、达标进度；仅在学员授权后显示
    page_priority: P0
  - id: O04-03
    name: 学习节奏
    text: 近期有效学习日、计划完成率、中断情况
    page_priority: P0
  - id: O04-04
    name: 作业与考试记录
    text: 机构布置的作业、班级考试的提交与成绩
    page_priority: P0
  - id: O04-05
    name: 预警与跟进时间线
    text: 历次预警、联系记录、约定事项与回访
    page_priority: P0
  - id: O04-06
    name: 学员主动留言
    text: 学员点“请老师联系我”时的留言与期望时间
    page_priority: P0
  - id: O04-07
    name: 沟通要点
    text: 先肯定什么、再约什么；提醒不要提及未授权的信息
    page_priority: P1
  - id: O04-08
    name: 服务记录
    text: 报名、协议、权益、调班、请假、退费
    page_priority: P1
  - id: O04-09
    name: 学习报告下发
    text: 阶段报告一键生成，老师审阅后发给学员
    page_priority: P1
  - id: O04-10
    name: 进度证明
    text: 须学员本人确认才能导出
    page_priority: P1
