items:
  - id: O06-01
    name: 教学计划模板
    text: 按班型制定进度；下发后与个人计划融合而不是覆盖
    page_priority: P0
  - id: O06-02
    name: 作业布置
    text: 题组、主观题、背诵、阅读，可按档位分层，直接进入学员今日
    page_priority: P0
  - id: O06-03
    name: 截止、催交与补交
    text: 截止前提醒；逾期可补交并标记
    page_priority: P0
  - id: O06-04
    name: 提交与达标统计
    text: 谁没交、谁没达标；达标以证据为准
    page_priority: P0
  - id: O06-05
    name: 布置时显示剩余可用时间
    text: 布置作业时显示“这个班本周平均还剩几小时可用，本次约几分钟”，超出时建议减量
    page_priority: P0
  - id: O06-06
    name: 分层与个别布置
    text: 按分层、标签或单个学员布置不同任务
    page_priority: P1
  - id: O06-07
    name: 补强物料
    text: 针对班级薄弱点生成讲义与练习，老师审核后下发
    page_priority: P1
  - id: O06-08
    name: 必修与选修
    text: 任务可标为必修，必修完成率单独统计
    page_priority: P1
  - id: O06-09
    name: 计划进度对照
    text: 班级实际进度与计划的偏差，并给调整建议
    page_priority: P1
