    name: 与个人导师的边界
    text: 学员与个人导师的对话机构不可见；只有发给机构助教的才可见
    page_priority: P0
  - id: O10-04
    name: 机构助教
    text: 按本机构讲义与口径首答；学员端明示“机构助教，机构可见”
    page_priority: P1
  - id: O10-05
    name: 助教测试台
    text: 上线前用样题测试助教的回答，提前发现口径问题
    page_priority: P1
  - id: O10-06
    name: 高频问题沉淀
    text: 反复被问的问题归并为知识库条目
    page_priority: P1
  - id: O10-07
    name: 老师答复回流
    text: 老师的答复补进机构知识库，下次由助教首答
    page_priority: P1
  - id: O10-08
    name: 答疑质量抽检
    text: 抽查助教与老师的答复，错误可撤回并通知
    page_priority: P1
  - id: O10-09
    name: 值班与响应时限
    text: 排班、响应时限与超时升级
    page_priority: P1
  - id: O10-10
    name: 讲义优先与考试关闭
    text: 与讲义冲突时以讲义为准并提示老师；班级考试期间关闭
    page_priority: P1
