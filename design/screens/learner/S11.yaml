# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S11
end: learner
title: 我的资料
mode: standard
purpose: 不要求换资料，把已有的书、课、题接到地图上。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 还没有资料：把手头的书、课、题接进来，不用换资料；主按钮“添加资料”
  offline: 已解析的资料可离线阅读；上传与解析需要联网
  restricted: 解析额度用完时，新文件进入队列；已解析的不受影响
  insufficient_data: 资料只覆盖了部分知识点：体检会列出缺口
layout_notes: [页头：我的资料；主按钮“添加资料”。, 统计行：覆盖率、待确认、解析额度、收件箱。, 标签：资料（按目标分组的表；有自建地图时顶部显示其出生记录）｜待确认（批量 / 逐条）｜体检｜收件箱｜模板与学习包。]
data:
  writes: [资料与知识点的映射, 各资料的阅读进度]
ai:
  - role: 多模态解析、对齐与价值评分；课程目录匹配。
entries: [S06, S09, S34]
exits: [S02, S09, S12]
unresolved_links: [S17, S32]
items:
  - id: S11-01
    name: 统一我的资料
    text: 教材、课程、题库、往年卷、笔记、链接一处管理，按科目成树
    page_priority: P0
  - id: S11-02
    name: 三种接入方式
    text: 可解析（本人有权使用的文件）、只映射（纸质书页码）、只外链（第三方平台课程）
    page_priority: P0
  - id: S11-03
    name: 导入向导
    text: 选择文件、解析预览、执行、结果四步；失败给原因与重试
    page_priority: P0
  - id: S11-04
    name: 十类资料
    text: 文档、课件、文本、图片与手写、视频、音频、网页、题库表格、书号、模板
    page_priority: P0
  - id: S11-05
    name: 生成或对齐
    text: 导入时选“据此生成新地图”或“对齐到已有地图”
    page_priority: P0
  - id: S11-06
    name: 自动对齐与价值评分
    text: 每段给知识点、关联类型、置信度与价值分；低价值不挂
    page_priority: P0
  - id: S11-07
    name: 对齐审核
    text: 高置信自动接受，中置信待确认，可改知识点、改类型或拒绝；可一键接受高置信
    page_priority: P0
  - id: S11-08
    name: 双进度
    text: 已读（阅读位置）与已达标（知识点到了目标档）分开显示，读完不等于学会
    page_priority: P0
  - id: S11-09
    name: 纸书影子书
    text: 只建目录与页码映射，不采集正文
    page_priority: P0
  - id: S11-10
    name: 外部课程伴学
    text: 登记目录，标出要看的讲次时段，外链跳转，回来做题确认
    page_priority: P0
  - id: S11-11
    name: 私有与版权边界
    text: 导入内容仅本人可见、不进公共库、不用于训练；上传时确认有权使用
    page_priority: P0
  - id: S11-12
    name: 额度与处理状态
    text: 存储与解析额度、每份资料的进度与失败原因
    page_priority: P0
  - id: S11-13
    name: 重新解析
    text: 保留标注、笔记与学习记录；内容变化大的知识点由用户决定合并还是拆分
    page_priority: P1
  - id: S11-14
    name: 增强资料
    text: 在段落旁挂图片、音视频、网页、画板、讲解片段
    page_priority: P1
  - id: S11-15
    name: 资料体检
    text: 覆盖率、多份重复、与新版不一致、无资料覆盖的知识点
    page_priority: P1
  - id: S11-16
    name: 主资料建议
    text: 多份重合时建议主学哪一份
    page_priority: P1
  - id: S11-17
    name: 学习收件箱
    text: 碎片捕获由导师预处理并建议去向
    page_priority: P1
  - id: S11-18
    name: 模板发布
    text: 把自己整理的科目发布为模板，可选带哪些内容；有版本与举报机制
    page_priority: P1
  - id: S11-19
    name: 作者中心
    text: 我发布的模板的有效使用人数、使用者的达标率、题目报错与待更新提醒
    page_priority: P1
  - id: S11-20
    name: 作者激励
    text: 按有效使用人数计、不按导入量，奖励认证标识、导师额度或会员时长
    page_priority: P1
  - id: S11-21
    name: 整包导出
    text: 把一个科目的地图、个人题库、笔记、卡片打包导出
    page_priority: P1
  - id: S11-22
    name: 原创收益分成
    text: 通过版权核验的原创内容可申请收益分成
    page_priority: P1
  - id: S11-23
    name: 资料与题库整理
    text: 资料和题库可重命名、复制，或移动到其他科目或目标；移动时知识点、笔记、标注与学习记录随之迁移
    page_priority: P1
