# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S22
end: learner
title: 模考中心
mode: standard
purpose: 一切按考场来；开考前讲清规则，开考后只剩题目和时间。
views:
  - id: home
    when: 落地页
  - id: confirm
    when: 开考确认
    mode: immersive
  - id: exam
    when: 作答中
    mode: immersive
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 没有可用的模考：导入一套往年卷或真题，即可组成模考；主按钮“导入试卷”（去 S11）
  offline: 已下载的试卷可离线作答，交卷联网后提交；断线可续考
  restricted: 同一场模考不允许多端同时作答
  insufficient_data: 不足 200 人参加时不显示排名
layout_notes:
  - 页头：模考中心；动作“纸笔模式”“全站联考”。
  - 左栏：下一场 → 可用模考表（卷名、规格、时长、来源）→ 历次模考（与目标线差、趋势）。右栏：仿真设置、切屏记录开关（个人默认关）。
  - 开考：确认页（规则 6 条、切屏告知）→ 沉浸作答页（剩余时间三档预警、题型分区、交卷）。
data:
  writes: [整卷作答过程]
ai:
  - role: 按薄弱点与真题分布组卷；主观题预批改。
entries: [S17]
exits: [S23]
unresolved_links: [S24]
items:
  - id: S22-01
    name: 多规格
    text: 全真套卷、半卷、阶段测评、按薄弱点定制卷
    page_priority: P0
  - id: S22-02
    name: 严格计时
    text: 到点自动交卷，分三档预警；计时不受本地改时影响
    page_priority: P0
  - id: S22-03
    name: 过程记录
    text: 每题用时、作答顺序、改答案次数
    page_priority: P0
  - id: S22-04
    name: 测评态
    text: 关闭导师、搜题、提示与解析，交卷后统一揭晓
    page_priority: P0
  - id: S22-05
    name: 断点续考
    text: 意外中断可续；长时间未回来按放弃处理并保留已答
    page_priority: P0
  - id: S22-06
    name: 自动排入计划
    text: 冲刺期按节奏排模考
    page_priority: P0
  - id: S22-07
    name: 开考确认页
    text: 开考前一页讲清考场规则与切屏告知；确认后进入沉浸作答
    page_priority: P0
  - id: S22-08
    name: 试卷快照
    text: 开考后题目改动不影响本场
    page_priority: P1
  - id: S22-09
    name: 多端互斥
    text: 同一场考试不能在两台设备同时作答
    page_priority: P1
  - id: S22-10
    name: 形式仿真
    text: 按考试画像还原机考布局或纸笔模式（打印、拍照回收答题卡）
    page_priority: P1
  - id: S22-11
    name: 时段对齐
    text: 按真实开考时间训练
    page_priority: P1
  - id: S22-12
    name: 纸笔模式
    text: 打印作答，拍照识别答题卡与主观题
    page_priority: P1
  - id: S22-13
    name: 切屏记录
    text: 仅在用户知情同意后记录，只作自我复盘
    page_priority: P2
  - id: S22-14
    name: 联考
    text: 统一时间开考（有组织方时）
    page_priority: P2
