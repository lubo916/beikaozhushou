# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S12
end: learner
title: 阅读器
mode: immersive
purpose: 读了要留证据；读的时候知道每段在讲哪个知识点、我会不会。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 这份资料还没解析好：预计 3 分钟；先读别的章节也可以；主按钮“回到我的资料”（去 S11）
  offline: 已下载章节可离线阅读，读后即测联网后计入
  restricted: 授权内容不可复制整段、不可导出原文
  insufficient_data: 段落与知识点对齐置信度低时标“待确认”
layout_notes:
  - 版式：沉浸页
  - 顶部工具条：返回、书名与章节、模式、层级筛选、纸书页码、撤销、已读与已学。
  - 左：可收起目录。
  - 中：章前导读 → 带书脊的段落 → 折叠的已达标段 → 读后即测卡。
  - 右：当前知识点迷你卡，下方讲解、笔记、关联、题目四标签。
  - 手机上右面板改为底部面板，书脊变段首标签，工具条收成一行加「更多」。
data:
  writes: [有效阅读, 标注, 笔记, 读后检测结果]
ai:
  - role: 按用户当前档位讲解选中内容；生成读后检测题、挖空与变形。
entries: [S06, S10, S11, S14, S15, S28, S29]
exits: [S09, S18]
items:
  - id: S12-01
    name: 基础阅读
    text: 目录、层级展开、搜索、字号行高、主题、书签、断点续读
    page_priority: P0
  - id: S12-02
    name: 考点标注层
    text: 段落旁显示知识点、重要度、当前档与目标档
    page_priority: P0
  - id: S12-03
    name: 三种标注
    text: 划线、高亮、挖空；颜色与线型可设默认
    page_priority: P0
  - id: S12-04
    name: 划选工具条
    text: 讲一下、记笔记、做成卡、找题、挖空、变形六个动作，在阅读、字幕、解析页一致
    page_priority: P0
  - id: S12-05
    name: 三种模式
    text: 阅读、挖空、问答（简答自测），随时切换
    page_priority: P0
  - id: S12-06
    name: 读后即测
    text: 每节后一组短题，通过才计为有效学习；未过时指出回看哪一段
    page_priority: P0
  - id: S12-07
    name: 侧栏讲解
    text: 自动带入选中内容与所在知识点，五种讲法可切换
    page_priority: P0
  - id: S12-08
    name: 追问五键
    text: 我懂了、讲简单点、举个例子、考考我、稍后复习；同时作为难度信号
    page_priority: P0
  - id: S12-09
    name: 侧栏笔记
    text: 五种笔记类型、富文本与手写画板、语音转写，导师可整理成稿
    page_priority: P0
  - id: S12-10
    name: 纸书伴读
    text: 输入或拍下页码，调出该页的知识点、题与卡
    page_priority: P0
  - id: S12-11
    name: 语义标注
    text: 可给标注打“重点、没懂、易错、要背”语义；没懂进导师待解释，要背进制卡候选
    page_priority: P1
  - id: S12-12
    name: 章前导读
    text: 本节几个知识点、哪里最弱、预计多久
    page_priority: P1
  - id: S12-13
    name: 侧栏关联与题目
    text: 查看并补充本知识点的关联知识与题目
    page_priority: P1
  - id: S12-14
    name: 做题巩固
    text: 不离开阅读页做本知识点的题
    page_priority: P1
  - id: S12-15
    name: 撤销与重做
    text: 标注与格式操作可逐步撤销
    page_priority: P1
  - id: S12-16
    name: 增强资料
    text: 在知识点下挂视频、音频、图片、AI 讲解、手绘画板、网页，默认折叠
    page_priority: P1
  - id: S12-17
    name: 听书
    text: 章节转语音，可只听高频段落；收听计入接触，不单独判定掌握
    page_priority: P1
  - id: S12-18
    name: 手写笔模式
    text: 平板手写批注，保存为可搜索的笔迹
    page_priority: P1
  - id: S12-19
    name: 有效阅读计时
    text: 无交互超过一定时长即暂停计时
    page_priority: P1
  - id: S12-20
    name: 授权内容保护
    text: 全文只对授权电子教材、机构讲义与用户自有文件开放；授权教材限制大段复制并带水印
    page_priority: P1
  - id: S12-21
    name: 导师与讲解面板合一
    text: 阅读器内点“问导师”切到右侧“讲解”标签，不另开抽屉
    page_priority: P1
  - id: S12-22
    name: 已达标折叠
    text: 已达标的段落默认折叠，可展开
    page_priority: P2
  - id: S12-23
    name: 版本对照
    text: 教材改版处提示新增、删除与改写
    page_priority: P2
