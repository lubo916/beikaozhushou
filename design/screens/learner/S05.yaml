# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S05
end: learner
title: 起点报告与方案
mode: guided
purpose: 回答四件事：现在在哪、差多少、差在哪、时间够不够；然后让人自己选方案。
views:
  - id: normal
    when: 正常
  - id: quick
    when: 只做了快速定位
states: [loading, empty, error, offline, restricted, insufficient_data, locked]
state_overrides:
  empty: 还没有起点报告：做完摸底诊断才能生成；也可先用快速定位；主按钮“去摸底”（去 S04）
  offline: 显示上次生成的报告；重新生成需要联网
  restricted: 游客可以看报告，生成计划时才需要登录
  insufficient_data: 只做了快速定位：区间更宽，补做章节抽测可收窄
  locked: 地图体检不通过时，预测类区块显示原因与“去修复”，学习照常
layout_notes:
  - 英雄区：预测区间、合格线与目标、一句解读、依据与置信度。
  - 两栏：时间够不够（小时对比、余量或缺口、三条出路）｜地图（标签：方格 / 薄弱章节）。
  - 差距表，含建议列。
  - 学习范围初稿，提议卡。
  - 三张方案卡：推荐标记、每周小时、预期、代价、边际收益。
  - 轮次草案时间轴。
  - 主按钮“生成我的计划”；另画体检不通过、只做了快速定位两种特殊态。
  - 手机上在英雄区下放「直接选方案」锚点按钮，免得滚过地图和两张表才能生成计划。
data:
  reads: [诊断, 时间预算, 考试画像]
  writes: [方案, 范围初稿, 首版计划参数]
ai:
  - role: 按性价比给差距项排序；把数据翻译成不打击人的说明。
entries: [S04]
exits: [S04, S06, S09, S10]
items:
  - id: S05-01
    name: 预测分区间与差额
    text: 给区间不给单点，注明依据的证据量与置信程度
    page_priority: P0
  - id: S05-02
    name: 掌握方格图
    text: 整张地图一屏看完，每格一个知识点，按六档着色
    page_priority: P0
  - id: S05-03
    name: 差距归因表
    text: 把分差拆成未学的高频点、学过已忘、会但不稳、低频冷门，各给可提分、所需时间与性价比
    page_priority: P0
  - id: S05-04
    name: 薄弱章节排序
    text: 按章给出达标比例与未学数量，标出高频
    page_priority: P0
  - id: S05-05
    name: 时间可行性
    text: 按声明时间扣除不可学日与缓冲，推算目标日前能覆盖计划的百分之几
    page_priority: P0
  - id: S05-06
    name: 学习范围初稿
    text: 默认范围是有目标档的知识点；时间不够时列出建议移出的低性价比知识点及代价
    page_priority: P0
  - id: S05-07
    name: 三档方案
    text: 稳妥、标准、冲刺，各给每日时长与预期区间，由用户选择
    page_priority: P0
  - id: S05-08
    name: 一键生成计划
    text: 生成轮次路线与第一周日计划，并用一段话解释逻辑
    page_priority: P0
  - id: S05-09
    name: 此处才要求登录
    text: 用户已经有了值得保存的东西
    page_priority: P0
  - id: S05-10
    name: 体检不通过态
    text: 自建或模板地图有阻断项时不给预测，只给掌握分布与逐项修复清单；修完自动复检
    page_priority: P0
  - id: S05-11
    name: 阶段·轮次草案
    text: 按考期长度给出阶段划分与每轮学法（通读、精学、练测、冲刺）
    page_priority: P1
  - id: S05-12
    name: 只做了快速定位态
    text: 区间更宽并写明原因，提示补做章节抽测可收窄
    page_priority: P1
  - id: S05-13
    name: 方案边际收益
    text: 每张方案卡写“比稳妥多几小时 / 周，区间上移约几分”
    page_priority: P1
  - id: S05-14
    name: 导出与分享
    text: 导出为文档；分享图只含用户选择展示的信息
    page_priority: P2
