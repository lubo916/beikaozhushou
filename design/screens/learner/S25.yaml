# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S25
end: learner
title: 考试日历与资讯
mode: standard
purpose: 不错过、不看错；只推和你有关的节点与变化。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 还没有考试节点：目标日已设，官方节点公布后自动加入；主按钮“加自定节点”
  offline: 日历可离线查看
  restricted: 短信提醒需要绑定手机号
  insufficient_data: 官方未公布的日期标“预计”并写依据
layout_notes:
  - 页头：考试日历与资讯；动作“同步到系统日历”。
  - 左栏：多目标合并时间线（节点带“预计”与依据，可加自定节点）→ 公告（已核验、原文链接、对你意味着什么）。
  - 右栏：考试详情 → 提醒设置 → 考前清单（临近时）→ 动态积累（有开放域模块时）。
data:
  reads: [目标与地区]
  writes: [提醒订阅]
ai:
  - role: 公告信息抽取与相关度过滤；变化影响分析。
entries: [S06, S35]
exits: [S02]
unresolved_links: [S07, S26, S27]
items:
  - id: S25-01
    name: 个人考试日历
    text: 报名、缴费、准考证、考试、出分等节点；自建目标可自定节点
    page_priority: P0
  - id: S25-02
    name: 多科目视图
    text: 同一考试多科分天的日程与同日多场
    page_priority: P0
  - id: S25-03
    name: 倒计时
    text: 距最近一场与距目标日
    page_priority: P0
  - id: S25-04
    name: 递进提醒
    text: 按节点提前分次提醒；考试当天只保留考务提醒
    page_priority: P0
  - id: S25-05
    name: “预计”标注
    text: 官方未公布前显示预计时间与依据
    page_priority: P0
  - id: S25-06
    name: 公告监测
    text: 只推与我相关的；人工对照原文核验后发布并附原文链接
    page_priority: P1
  - id: S25-07
    name: 变化解读
    text: 大纲或政策变化对我意味着什么、计划是否要调
    page_priority: P1
  - id: S25-08
    name: 成绩有效期
    text: 滚动周期内各科何时失效，临期预警
    page_priority: P1
  - id: S25-09
    name: 考前清单
    text: 证件、文具、禁带物品、路线
    page_priority: P1
  - id: S25-10
    name: 考试详情
    text: 主管机构、报考条件、科目与题型、合格标准、成绩有效期、官网链接
    page_priority: P1
  - id: S25-11
    name: 动态积累
    text: 与考试相关的时事、行业动态、新规，按相关度进入积累型卡片与素材
    page_priority: P1
  - id: S25-12
    name: 日历同步
    text: 同步到系统日历
    page_priority: P2
slice: design/screens/slices/S25.html
shots: design/screens/shots/S25/
