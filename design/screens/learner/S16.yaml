# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S16
end: learner
title: 背诵训练
mode: standard
purpose: 复刻“捂住书自己背一遍”，并补上有人检查背得对不对。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 还没有要背的内容：在阅读器里标注“要背”的段落会出现在这里；主按钮“去阅读器”（去 S12）
  offline: 挖空与默写可离线；口述检测需要联网
  restricted: 口述检测按次计入 AI 额度；挖空与默写不限
  insufficient_data: 口述样本少于 3 次时不给顺序评分
layout_notes: [页头：背诵训练；动作“今日晨读包”。, 方式标签，默认按知识点类型选中。, 左：当前背诵内容与作答区；右：上次结果（覆盖、准确、顺序、漏项）与隐私说明。]
data:
  writes: [要点级背诵结果, 更新记忆稳定度]
ai:
  - role: 语音识别与要点语义匹配；术语词表校正。
entries: [S06, S14]
exits: []
unresolved_links: [S15, S20, S21]
items:
  - id: S16-01
    name: 渐进挖空
    text: 从挖关键词，到只留首字，再到全文默写
    page_priority: P0
  - id: S16-02
    name: 两种挖空来源
    text: 用户自己标的挖空与导师自动挖空并存
    page_priority: P0
  - id: S16-03
    name: 逐级宽松比对
    text: 完全正确、基本正确、部分正确、错误四档，阈值可调
    page_priority: P0
  - id: S16-04
    name: 要点背诵
    text: 只背得分点骨架，不要求逐字
    page_priority: P0
  - id: S16-05
    name: 口述检测
    text: 语音转写后按要点覆盖、关键词、顺序评分
    page_priority: P0
  - id: S16-06
    name: 分段与合并
    text: 长文拆成小段，再逐步合并
    page_priority: P0
  - id: S16-07
    name: 并入统一调度
    text: 背过的内容进入同一条到期队列
    page_priority: P0
  - id: S16-08
    name: 录音隐私
    text: 录音默认只用于本次评分，不保存
    page_priority: P0
  - id: S16-09
    name: 讲给导师听
    text: 用自己的话讲一遍，导师指出讲错、漏讲与讲得好的地方
    page_priority: P1
  - id: S16-10
    name: 默写检测
    text: 键入或手写拍照，标出漏写、错写与顺序
    page_priority: P1
  - id: S16-11
    name: 对比记忆
    text: 易混条目同表比对
    page_priority: P1
  - id: S16-12
    name: 口诀与联想
    text: 生成口诀与首字串联，可改写保存
    page_priority: P1
  - id: S16-13
    name: 听背模式
    text: 循环播放，可设“播一句留白一句”
    page_priority: P1
  - id: S16-14
    name: 数字专项
    text: 数值类内容用填空与配对练习
    page_priority: P1
slice: design/screens/slices/S16.html
shots: design/screens/shots/S16/
