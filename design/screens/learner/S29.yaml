# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S29
end: learner
title: 搜索与速查
mode: standard
purpose: 一个入口搜遍知识点、资料原文、题目、笔记与错题，查完就能直接学。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 输入关键词开始搜索：可以搜知识点、资料原文、题目、笔记与错题
  offline: 离线只能搜已缓存的内容
  restricted: 拍照搜题按次计额度
  insufficient_data: 没找到时可以反馈，并提示去问导师
layout_notes: [搜索框加拍照搜题。, 空状态：最近访问、速查表入口。, 有结果：左栏分组结果（可切类型），右栏与关键词相关的那张速查表；重复搜索时出现攻坚建议。]
data:
  reads: [平台内容与个人资产]
ai:
  - role: 语义检索与多模态识别。
entries: []
exits: [S10, S12, S13, S14, S18, S28]
unresolved_links: [S19]
items:
  - id: S29-01
    name: 统一搜索
    text: 全局快捷键唤起；支持拼音、模糊、自然语言
    page_priority: P0
  - id: S29-02
    name: 分层结果
    text: 知识点、我的资料原文、题目、笔记与错题、导师答过的
    page_priority: P0
  - id: S29-03
    name: 最近访问
    text: 最近看过的知识点与资料，一键回到
    page_priority: P1
  - id: S29-04
    name: 速查表自动生成
    text: 数值与时限、公式、条文、术语、易混对照，由对应类型的知识点汇成
    page_priority: P1
  - id: S29-05
    name: 拍照搜题
    text: 先问想做什么
    page_priority: P1
  - id: S29-06
    name: 搜索即行动
    text: 结果可直接加入今日、制卡、记笔记
    page_priority: P1
  - id: S29-07
    name: 条文与规范速查
    text: 标注生效日期与效力状态（有此类数据的考试）
    page_priority: P2
  - id: S29-08
    name: 重复搜索提醒
    text: 同一概念反复搜索时，建议花点时间彻底解决
    page_priority: P2
  - id: S29-09
    name: 没找到的反馈
    text: 记录搜了什么、期望找到什么
    page_priority: P2
