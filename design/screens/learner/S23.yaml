# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S23
end: learner
title: 测评报告
mode: standard
purpose: 一次整卷测评不只产出一个分数：处在哪、分丢在哪、时间花在哪、接下来七天做什么。同一套报告服务诊断、模考、阶段测评。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 还没有测评报告：做完一场整卷测评后生成；主按钮“去模考”（去 S22）
  offline: 显示已生成的报告
  restricted: 主观题未评分时总分为暂定，并写明
  insufficient_data: 样本不足 200 人不显示排名
layout_notes:
  - 页头：测评报告与日期；动作“逐题复盘”“分享成绩”。
  - 英雄区：分数、离目标线、一句话解读、排名或样本说明、切屏次数、主观题待评分提示。
  - 左栏：失分归因（六类）→ 时间策略表 → 七日补强清单。右栏：知识点诊断 → 信心校准 → 策略模拟 → 待归因入口。
data:
  reads: [模考过程]
  writes: [预测更新, 计划调整提议]
ai:
  - role: 失分归因、策略模拟与解读。
entries: [S22]
exits: [S06, S18, S19]
unresolved_links: [S07, S24]
items:
  - id: S23-01
    name: 成绩与位置
    text: 分数、与目标线的差距；样本足够才给百分位
    page_priority: P0
  - id: S23-02
    name: 失分归因
    text: 没学过、学过忘了、会但做错、没做完、蒙错、表达扣分
    page_priority: P0
  - id: S23-03
    name: 错因与陷阱分布
    text: 点图例看对应题目；未归因的提示去归因
    page_priority: P0
  - id: S23-04
    name: 题型与知识点分析
    text: 各题型得分率、各知识点正确率
    page_priority: P0
  - id: S23-05
    name: 时间策略
    text: 各部分用时、末段完成率、做题顺序
    page_priority: P0
  - id: S23-06
    name: 主观题评分
    text: 待评分题在此完成评分，评完更新总分
    page_priority: P0
  - id: S23-07
    name: 逐题复盘与错题重做
    text: 每题的作答、用时、把握度与解析；一键重做本场错题
    page_priority: P0
  - id: S23-08
    name: 补强清单
    text: 按性价比排出近期的补强任务，以提议加入计划
    page_priority: P0
  - id: S23-09
    name: 把握度校准
    text: “确定却做错”与“蒙对”的比例
    page_priority: P1
  - id: S23-10
    name: 策略模拟
    text: 例如换做题顺序预计多拿几分
    page_priority: P1
  - id: S23-11
    name: 报告解读
    text: 用一段话说这次最该在意什么、不必在意什么
    page_priority: P1
  - id: S23-12
    name: 低分表达
    text: 不打击，给最短的回升路径
    page_priority: P1
  - id: S23-13
    name: 分享成绩
    text: 只含用户选择展示的信息
    page_priority: P2
