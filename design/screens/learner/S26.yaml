# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S26
end: learner
title: 报考决策
mode: standard
purpose: 选岗、择校、选证书路径时只提供信息，不替你决定。
extension_pack: true
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 当前考试没有决策数据：岗位库、院校库或证书路径数据就绪后才会出现本页
  offline: 需要联网
  restricted: 只提供信息，不替你决定；未公布的数据不估算
  insufficient_data: 个人条件档案不完整时，只做粗筛
layout_notes: [版式：只在招录、升学类考试出现, 页头：报考决策；常驻数据年份与来源。, 左栏：可报选项表（按个人条件过滤，冲稳保）→ 并排对比。, 右栏：个人条件档案 → 报考条件自测入口。选定后生成提议。]
data:
  reads: [预测分, 个人条件]
  writes: [目标选项]
ai:
  - role: 条件匹配解析；基于预测分与历史数据估计概率区间。
