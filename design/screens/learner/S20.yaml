# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S20
end: learner
title: 主观题批改
mode: standard
purpose: 让论述、写作、案例、简答都有及时反馈；给区间，只改你写的句子。
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 还没有提交：键入、拍照或语音提交一道主观题；主按钮“提交新答案”
  offline: 可离线作答，批改在联网后进行
  restricted: 导师批改每次消耗 AI 点数；对照得分点自评与暂不评分不消耗
  insufficient_data: 没有评分细则时只给要点反馈，不给分数区间
layout_notes:
  - 页头：主观题批改；动作“提交新答案”“规范表述本”；标签“我的练习、机构作业”。
  - 左栏：题目与作答（三种输入）→ 逐句批注 → 采分点对照表 → 升格示范。
  - 右栏：评分方式 → 分数区间 → 问题模式 → 下一步。
data:
  writes: [分项得分, 得分点命中, 形成表达能力画像]
ai:
  - role: 取细则、逐点判定、多次评分取稳定值；把握低时转人工或只给要点。
entries: [S06]
exits: [S18]
unresolved_links: [S16, S19, S24, S28]
items:
  - id: S20-01
    name: 多题型
    text: 简答、论述、案例、作文、翻译、计算大题、算法与证明
    page_priority: P0
  - id: S20-02
    name: 多种提交
    text: 键入、手写拍照、语音
    page_priority: P0
  - id: S20-03
    name: 三种评分方式
    text: 导师批改、对照得分点自己打分、暂不评分；待评分题不计入正确率
    page_priority: P0
  - id: S20-04
    name: 得分点对照
    text: 命中、部分命中、遗漏逐条列出
    page_priority: P0
  - id: S20-05
    name: 分数区间与把握度
    text: 多次独立评分取区间；一致性不达标的题型只给要点反馈不给分
    page_priority: P0
  - id: S20-06
    name: 评分细则来源
    text: 标明来自官方、模板作者、机构，还是由参考答案提取
    page_priority: P0
  - id: S20-07
    name: 逐句批注
    text: 标在用户原文上
    page_priority: P0
  - id: S20-08
    name: 升格示范
    text: 只改用户写的句子，不替写全文
    page_priority: P1
  - id: S20-09
    name: 重写再批
    text: 同题多稿对比，看改进是否落实
    page_priority: P1
  - id: S20-10
    name: 问题模式追踪
    text: 追踪反复出现的问题，例如连续多次要点不全
    page_priority: P1
  - id: S20-11
    name: 规范表述积累
    text: 批改中出现的规范表述沉淀为素材与卡片
    page_priority: P1
  - id: S20-12
    name: 限时写作
    text: 按考场时间与字数练
    page_priority: P1
  - id: S20-13
    name: 追问与存笔记
    text: 对批改追问，结论存为题目笔记或加入错题本
    page_priority: P1
  - id: S20-14
    name: 高分对比
    text: 与同题高分作答按采分点逐条对齐比较
    page_priority: P1
  - id: S20-15
    name: 机构作业
    text: 老师复核前学员只看到「批改中」与 AI 要点，不显示分数
    page_priority: P1
  - id: S20-16
    name: 消耗告知
    text: 批改为重型操作，提交前告知消耗点数
    page_priority: P1
  - id: S20-17
    name: 人工复评
    text: 对批改有异议可申请人工复核（有人工服务时）
    page_priority: P2
