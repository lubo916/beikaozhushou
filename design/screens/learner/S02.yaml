# 页面登记：范围的唯一来源（ADR-001，原型冻结后以本文件为准）。条目编号只增不减；删除的条目标 removed: true；新条目只在末尾追加，编号用 import-prototype --write-ids 分配。
id: S02
end: learner
title: 备考目标
mode: guided
purpose: 把考什么、何时考、考到多少结构化；库里没有的考试也能建。
views:
  - id: first
    when: 首次（引导流）
  - id: manage
    when: 管理态
    mode: standard
states: [loading, empty, error, offline, restricted, insufficient_data]
state_overrides:
  empty: 还没有备考目标：从官方考试库、模板或自建三条来路选一个；主按钮“选目标”（去 S02）
  offline: 离线可看已建目标；搜索考试库与导入模板需要联网
  restricted: 游客最多建 1 个目标；登录后可同时进行的目标数随档位，见会员与权益
  insufficient_data: 考试库里没有这个考试时，引导自建，并如实标注就绪程度
layout_notes:
  - 首次进入：步骤条、标题、三个标签页（官方库｜模板｜自建）。
  - 选中后弹出“确认画像”面板：科目、目标日（含“预计”依据）、评价规则、目标分（默认合格线加安全边际）、目标初判，“下一步”。
  - 管理态（从目标切换器进入）：我的目标表（主次、考期、目标、地图来源、重叠率）与冲突提示；已过科目；地图版本；“＋新增目标”打开上面的三标签页。
data:
  writes: [目标（考试, 科目, 目标分, 评价规则, 日期, 主次）, 画像来源与版本]
ai:
  - role: 把口语化描述和上传的大纲解析成结构化画像；结合剩余时间做初步可行性判断。
entries: [S01, S03, S11, S25, S26, S34]
exits: [S01, S03]
unresolved_links: [S09]
items:
  - id: S02-01
    name: 官方考试库
    text: 按类别浏览或搜索，全称、简称、俗称、拼音均可；就绪度见本页「就绪程度标注」
    page_priority: P0
  - id: S02-02
    name: 模板大厅
    text: 导入他人发布的考试包或科目包，可看完整度、题目密度、维护活跃度，可只挑部分科目与内容
    page_priority: P0
  - id: S02-03
    name: 自建目标向导
    text: 说一句话或上传大纲、目录、往年试卷，系统识别出科目、题型、分值与日期，用户逐项确认
    page_priority: P0
  - id: S02-04
    name: 考试画像编辑
    text: 科目、满分、题型分布、时长、考试形式、关键日期、成绩有效期、备考建议，均可手动修改
    page_priority: P0
  - id: S02-05
    name: 评价规则四选一
    text: 合格线型、择优型、分数段型、自定型，决定目标线怎么设、预测怎么表述
    page_priority: P0
  - id: S02-06
    name: 目标设定
    text: 合格类默认合格线加安全边际；择优类自设目标分并参考历年线；自定类由用户填写
    page_priority: P0
  - id: S02-07
    name: 关键日期与“预计”标注
    text: 官方未公布的日期标“预计”并注明依据；没有考试日的自定目标也要设一个目标日
    page_priority: P0
  - id: S02-08
    name: 目标主页
    text: 任何时候可回到这里改画像、换主次、暂停或归档目标
    page_priority: P0
  - id: S02-09
    name: 就绪程度标注
    text: 每个考试诚实标注：地图、题库、考情齐备；仅地图；仅考试信息；仅模板（平台没有官方数据，由他人发布的模板提供）；暂无
    page_priority: P0
  - id: S02-10
    name: 首次与管理两态
    text: 首次只有“选目标”的三条来路；从目标切换器进入时为管理态，“我的目标”表置顶
    page_priority: P0
  - id: S02-11
    name: 确认画像面板
    text: 选中考试后弹出确认：科目、目标日（含“预计”依据）、评价规则、目标分与目标初判；手机为底部面板
    page_priority: P0
  - id: S02-12
    name: 多目标并行
    text: 可添加多个目标并排主次，显示知识重叠率与时间冲突
    page_priority: P1
  - id: S02-13
    name: 再战继承
    text: 导入上次的成绩、错题与卡片，走“精准补漏”而不是重来
    page_priority: P1
  - id: S02-14
    name: 扩展包挂载
    text: 口述面试、报考决策、速查表等按考试画像自动挂载或手动开启
    page_priority: P1
  - id: S02-15
    name: 自然语言选考
    text: 一句话描述目标，返回候选考试
    page_priority: P1
  - id: S02-16
    name: 已过科目与有效期
    text: 录入已通过科目与有效期，临近失效时提醒
    page_priority: P1
  - id: S02-17
    name: 地图版本匹配
    text: 按报考年度匹配地图版本；新版未发布时沿用上一版并标「待更新」
    page_priority: P1
  - id: S02-18
    name: 证书路径视图
    text: 资格类考试在管理态显示先考哪科、成绩有效期约束、面试与资格认定的路径（由报考决策迁入）
    page_priority: P1
  - id: S02-19
    name: 报考条件自测
    text: 按规则库给初步判断与须核实的条件，不下结论；有规则库的考试才出现
    page_priority: P2
  - id: S02-20
    name: 我该考什么
    text: 未定目标者可比较不同考试的难度、周期、条件与知识重叠
    page_priority: P2
