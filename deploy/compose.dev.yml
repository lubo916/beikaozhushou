# 本地开发的数据库与 Redis（bk run --real 用它）：docker compose -f deploy/compose.dev.yml up -d
# PostgreSQL 17 用自制镜像 deploy/postgres/Dockerfile：pgvector、zhparser（中文分词）、pg_bigm（二元组索引）都在里面；第一次构建要几分钟。
# 只想快速起一个带 pgvector 的库时，把 build 一行注释掉、image 改成 pgvector/pgvector:pg17（zhparser、pg_bigm 相关测试以完整镜像为准）。
# 只监听本机地址；PostgreSQL 用 trust 认证，不写任何口令；连接串的写法见 .env.example。测试库 exam_prep_test 由 initdb 脚本建好。
name: exam-prep
services:
  postgres:
    build: ./postgres
    image: exam-prep/postgres:17-local
    environment:
      POSTGRES_USER: exam_prep
      POSTGRES_DB: exam_prep
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_prep -d exam_prep"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  redis-data:
