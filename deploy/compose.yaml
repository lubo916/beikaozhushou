# 本地开发的数据库与 Redis（0.1b 计划 D1）：docker compose -f deploy/compose.yaml up -d
# 只监听本机地址；PostgreSQL 用 trust 认证，不写任何口令；连接串的写法见 README“本地开发”。
name: exam-prep
services:
  postgres:
    build: ./postgres
    image: exam-prep/postgres:17-local
    environment:
      POSTGRES_USER: exam_prep
      POSTGRES_DB: exam_prep
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_prep -d exam_prep"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  redis-data:
