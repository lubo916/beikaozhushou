openapi: 3.1.0
info:
  title: 备考助手 API
  version: 0.1.0
  description: 三端共用的接口契约。operationId 全局唯一，x-owner 为所属领域（docs/conventions/api.md）。条目随功能追加。
servers:
  - url: /api
paths:
  /exams/{examId}:
    get:
      operationId: getExamProfile
      x-owner: exam
      summary: 读取考试画像
      parameters:
        - {name: examId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: 考试画像, content: {application/json: {schema: {$ref: "#/components/schemas/ExamProfile"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /maps/points/{pointId}:
    get:
      operationId: getKnowledgePoint
      x-owner: map
      summary: 读取知识点及其所属章节
      parameters:
        - {name: pointId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: 知识点, content: {application/json: {schema: {$ref: "#/components/schemas/KnowledgePoint"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /questions/{questionId}:
    get:
      operationId: getQuestion
      x-owner: content
      summary: 读取题目（揭晓前不含答案与解析）
      parameters:
        - {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: 题目, content: {application/json: {schema: {$ref: "#/components/schemas/Question"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /practice/next:
    get:
      operationId: nextQuestion
      x-owner: practice
      summary: 为指定知识点取下一道题
      parameters:
        - {name: pointId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: 题目, content: {application/json: {schema: {$ref: "#/components/schemas/Question"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /practice/answers:
    post:
      operationId: submitAnswer
      x-owner: practice
      summary: 提交作答并揭晓；同一幂等键重复提交返回第一次的结果
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AnswerSubmission"}}}
      responses:
        "200": {description: 揭晓结果, content: {application/json: {schema: {$ref: "#/components/schemas/AnswerResult"}}}}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
      x-errors: [PRAC_REVEAL_LOCKED, PRAC_CONFIDENCE_REQUIRED, COMMON_VALIDATION]
  /learner/evidence:
    post:
      operationId: recordEvidence
      x-owner: learner
      x-internal: true
      summary: 领域服务代表学员写入一条证据（不对端开放）
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EvidenceInput"}}}
      responses:
        "200": {description: 写入结果与重算后的档位, content: {application/json: {schema: {$ref: "#/components/schemas/MasteryCell"}}}}
        "422": {$ref: "#/components/responses/Error"}
  /learner/mastery-grid:
    get:
      operationId: getMasteryGrid
      x-owner: learner
      summary: 读取当前目标地图的掌握方格
      parameters:
        - {name: mapId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: 方格, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/MasteryCell"}}}}}
  /runtime-context:
    get:
      operationId: getRuntimeContext
      x-owner: platform
      x-public: true
      security: []
      summary: 0 期开发启动摘要，仅由服务端上下文派生；不接受客户端身份输入
      responses:
        "200": {description: 模拟身份是否为游客，不含身份值, content: {application/json: {schema: {type: object, additionalProperties: false, required: [guest, simulated], properties: {guest: {type: boolean}, simulated: {type: boolean, const: true}}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
      x-errors: [COMMON_FORBIDDEN, COMMON_UNAVAILABLE]
  /params:
    get:
      operationId: getParams
      x-owner: platform
      x-public: true
      security: []
      summary: 读取当前生效的参数取值（已夹在登记区间内）
      responses:
        "200": {description: 参数取值, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
      x-errors: [COMMON_FORBIDDEN, COMMON_UNAVAILABLE]
  /events:
    post:
      operationId: trackEvent
      x-owner: metrics
      x-public: true
      security: []
      summary: 上报 client 来源的 app_opened；server 事件仅经受信领域内部入口写入
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AnalyticsEvent"}}}
      responses:
        "202": {description: 已接收}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
      x-errors: [COMMON_VALIDATION, COMMON_FORBIDDEN, COMMON_CONFLICT, COMMON_UNAVAILABLE]
components:
  responses:
    Error:
      description: 错误，code 取自 contracts/errors.yaml
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      required: [code, message_key]
      properties: {code: {type: string}, message_key: {type: string}, details: {type: object}}
    ExamProfile:
      description: 结构见 contracts/exam-profile.schema.json
      type: object
    KnowledgePoint:
      type: object
      properties: {id: {type: string}, name: {type: string}, node_kind: {type: string}, knowledge_types: {type: array, items: {type: string}}, parent_id: {type: string}, default_target_level: {type: integer}}
    Question:
      type: object
      properties: {id: {type: string}, version: {type: integer}, response_form: {type: string}, stem: {type: object}, options: {type: array}, credibility: {type: string}}
    AnswerSubmission:
      type: object
      required: [question_id, question_version, response, confidence, duration_ms]
      properties: {question_id: {type: string}, question_version: {type: integer}, response: {type: object}, confidence: {type: string, enum: [sure, vague, guess, off]}, duration_ms: {type: integer}, hint_level: {type: integer}}
    AnswerResult:
      type: object
      properties: {correct: {type: boolean}, explanation: {type: object}, option_notes: {type: object}, evidence_strength: {type: string}, mastery: {$ref: "#/components/schemas/MasteryCell"}}
    EvidenceInput:
      type: object
      required: [learner_id, knowledge_point_id, source, confidence, duration_ms, occurred_at]
      properties: {learner_id: {type: string}, knowledge_point_id: {type: string}, source: {type: string}, source_ref: {type: string}, question_id: {type: string}, question_version: {type: integer}, correct: {type: boolean}, confidence: {type: string}, duration_ms: {type: integer}, hint_level: {type: integer}, occurred_at: {type: string, format: date-time}}
    MasteryCell:
      type: object
      properties: {knowledge_point_id: {type: string}, level: {type: integer}, target_level: {type: integer}, sufficiency: {type: string}, pending_verification: {type: boolean}, in_scope: {type: boolean}}
    AnalyticsEvent:
      type: object
      additionalProperties: false
      required: [name, properties, occurred_at]
      description: 公共请求仅含事件内容；身份、来源与 schemaHash 由受信服务端装配。server 事件名以 403 拒绝。
      properties: {name: {type: string}, properties: {type: object}, occurred_at: {type: string, format: date-time}}
