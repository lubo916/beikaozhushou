# 错误码。响应体统一为 {code, message_key, details}（docs/conventions/api.md）。
- code: COMMON_BAD_REQUEST
  owner: platform
  http_status: 400
  message_key: error.common.bad_request
  description: 请求体无法解析为合法 JSON
- code: COMMON_PAYLOAD_TOO_LARGE
  owner: platform
  http_status: 413
  message_key: error.common.payload_too_large
  description: 请求体超过登记的协议大小限制
- code: COMMON_UNSUPPORTED_MEDIA_TYPE
  owner: platform
  http_status: 415
  message_key: error.common.unsupported_media_type
  description: 请求体媒体类型不受支持
- code: COMMON_INTERNAL
  owner: platform
  http_status: 500
  message_key: error.common.internal
  description: 未预期内部异常；不向客户端返回异常细节
- code: COMMON_VALIDATION
  owner: platform
  http_status: 422
  message_key: error.common.validation
  description: 请求不符合接口结构
- code: COMMON_FORBIDDEN
  owner: platform
  http_status: 403
  message_key: error.common.forbidden
  description: 当前角色或数据范围无权执行该动作
- code: COMMON_NOT_FOUND
  owner: platform
  http_status: 404
  message_key: error.common.not_found
  description: 资源不存在或不在可见范围内
- code: COMMON_CONFLICT
  owner: platform
  http_status: 409
  message_key: error.common.conflict
  description: 同一幂等命名空间和键携带不同请求内容
- code: COMMON_UNAVAILABLE
  owner: platform
  http_status: 503
  message_key: error.common.unavailable
  description: 依赖不可用或持久化失败，不能宣称已接收
- code: PRAC_REVEAL_LOCKED
  owner: practice
  http_status: 409
  message_key: error.practice.reveal_locked
  description: 揭晓后不能修改答案（INV-24）
- code: PRAC_CONFIDENCE_REQUIRED
  owner: practice
  http_status: 422
  message_key: error.practice.confidence_required
  description: 把握度开启时，未选择把握度不能提交
