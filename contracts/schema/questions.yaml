table: questions
owner: content
description: 题目；内容修改产生新版本，证据记录作答时的版本；可信度决定证据上限（ADR-010）
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: public_content}
  - {name: version, type: int, x-data-class: public_content}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: exam_profile_id, type: uuid, ref: exam_profiles.id, x-data-class: public_content}
  - {name: owner_user_id, type: uuid, nullable: true, ref: users.id, x-data-class: personal_learning, note: 自有题的所有者；平台题为空}
  - {name: response_form, type: "enum[choice, fill, match_order, stepwise, written, material, listening, oral, practical_self]", x-data-class: public_content}
  - {name: question_type, type: string, x-data-class: public_content, note: 取自考试画像的题型}
  - {name: stem, type: json, x-data-class: public_content}
  - {name: options, type: json, nullable: true, x-data-class: public_content}
  - {name: answer, type: json, x-data-class: public_content}
  - {name: explanation, type: json, x-data-class: public_content, note: 一句话结论、分步推导、知识点回链、资料定位}
  - {name: option_notes, type: json, nullable: true, x-data-class: public_content, note: 逐选项解析与陷阱类型}
  - {name: credibility, type: "enum[reviewed, own, generated_confirmed, generated_instant]", x-data-class: public_content}
  - {name: source_ref, type: string, nullable: true, x-data-class: public_content, note: 出处；生成题记强证据的条件之一}
  - {name: created_at, type: timestamptz, x-data-class: public_content}
