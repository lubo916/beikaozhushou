table: mastery_levels
owner: learner
description: 掌握档的派生快照，可随时由 evidence_events 重算；只由 learner 写入（检查 E-OWN-02）
derived_from: evidence_events
tenant_scoped: true
fields:
  - {name: learner_id, type: uuid, ref: users.id, x-data-class: inferred}
