table: knowledge_maps
owner: map
description: 知识地图的版本；底图与扩展层分开，官方节点只读（ADR-009）
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: public_content}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: exam_profile_id, type: uuid, ref: exam_profiles.id, x-data-class: public_content}
  - {name: version, type: int, x-data-class: public_content}
  - {name: source, type: "enum[official, template, custom]", x-data-class: public_content}
  - {name: status, type: "enum[draft, published, retired]", x-data-class: public_content}
  - {name: published_at, type: timestamptz, nullable: true, x-data-class: public_content}
