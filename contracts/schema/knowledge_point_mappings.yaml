table: knowledge_point_mappings
owner: map
description: 地图版本之间的知识点映射；被拆分的点迁移后标“证据不足”而不清零（S09-14）
append_only: true
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: public_content}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: kind, type: "enum[rename, move, merge, split, retire]", x-data-class: public_content}
  - {name: from_point_ids, type: "array<uuid>", x-data-class: public_content}
  - {name: to_point_ids, type: "array<uuid>", x-data-class: public_content}
  - {name: from_version, type: int, x-data-class: public_content}
  - {name: to_version, type: int, x-data-class: public_content}
  - {name: created_at, type: timestamptz, x-data-class: public_content}
