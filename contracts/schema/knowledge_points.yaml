table: knowledge_points
owner: map
description: 知识点与章节节点；id 稳定不复用，名称、位置、版本可变，合并拆分经 knowledge_point_mappings 迁移学习记录（ADR-009）
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: public_content}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: map_id, type: uuid, ref: knowledge_maps.id, x-data-class: public_content}
  - {name: parent_id, type: uuid, nullable: true, ref: knowledge_points.id, x-data-class: public_content}
  - {name: node_kind, type: "enum[subject, chapter, section, point]", x-data-class: public_content}
  - {name: layer, type: "enum[base, extension]", x-data-class: public_content}
  - {name: name, type: string, x-data-class: public_content}
  - {name: knowledge_types, type: "array<enum[concept, fact, statute, procedure, application, essay, oral, practical, accumulation]>", x-data-class: public_content, note: 一至两个类型}
  - {name: default_target_level, type: int, nullable: true, x-data-class: public_content}
  - {name: importance, type: string, nullable: true, x-data-class: public_content, note: 官方或模板给默认值，个人覆盖另存（S10-02）}
  - {name: since_version, type: int, x-data-class: public_content}
  - {name: retired_in_version, type: int, nullable: true, x-data-class: public_content}
