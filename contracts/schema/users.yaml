table: users
owner: account
description: 账号，含游客身份；游客登录后其数据并入正式账号，合并关系留存（ADR-012）
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: account_info}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: kind, type: "enum[guest, registered]", x-data-class: account_info}
  - {name: phone, type: string, nullable: true, x-data-class: account_info, note: 存储加密；机构端脱敏展示（INV-13）}
  - {name: phone_verified_at, type: timestamptz, nullable: true, x-data-class: account_info}
  - {name: age_band, type: "enum[unconfirmed, under_min, minor, adult]", x-data-class: account_info, note: 未确认按未成年人处理（S01-02）}
  - {name: minor_mode, type: bool, x-data-class: account_info, note: 未成年人自动开启、本人不能关闭（INV-06）}
  - {name: merged_into, type: uuid, nullable: true, ref: users.id, x-data-class: account_info, note: 游客合并后的正式账号}
  - {name: merged_at, type: timestamptz, nullable: true, x-data-class: account_info}
  - {name: status, type: "enum[active, restricted, cooling_off, deleted]", x-data-class: account_info}
  - {name: created_at, type: timestamptz, x-data-class: account_info}
