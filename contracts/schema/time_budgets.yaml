table: time_budgets
owner: plan
description: 学员的时间预算：时间格或每日目标时长；各目标、机构作业与课表共享同一份预算（ADR-016）
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: personal_learning}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: learner_id, type: uuid, ref: users.id, x-data-class: personal_learning}
  - {name: weekly_grid, type: json, nullable: true, x-data-class: personal_learning, note: 可用时段及场景：深度块、碎片、通勤可听}
  - {name: daily_minutes, type: int, nullable: true, x-data-class: personal_learning, note: 不填时间格时的每日目标时长}
  - {name: unavailable_dates, type: "array<date>", x-data-class: personal_learning}
  - {name: source, type: "enum[declared, measured]", x-data-class: personal_learning}
  - {name: valid_from, type: date, x-data-class: personal_learning}
