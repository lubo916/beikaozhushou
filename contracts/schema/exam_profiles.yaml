table: exam_profiles
owner: exam
description: 考试画像，结构符合 contracts/exam-profile.schema.json；考试差异只进这里或扩展点
tenant_scoped: true
fields:
  - {name: id, type: uuid, pk: true, x-data-class: public_content}
  - {name: tenant_id, type: uuid, ref: tenants.id, x-data-class: operational}
  - {name: exam_key, type: string, unique_with: version, x-data-class: public_content}
  - {name: version, type: int, x-data-class: public_content}
  - {name: kind, type: "enum[official, template, custom]", x-data-class: public_content}
  - {name: evaluation_rule, type: "enum[pass_line, selective, score_band, custom]", x-data-class: public_content}
  - {name: profile, type: json, x-data-class: public_content, note: 完整画像，按 exam-profile.schema.json 校验}
  - {name: created_at, type: timestamptz, x-data-class: public_content}
