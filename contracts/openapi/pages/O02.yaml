# O02 简版只读演示契约；org.lead.read 待整合登记权限后接真实接口，所有写操作先提示即将上线。
paths:
  /org/leads/overview:
    get:
      operationId: getO02Leads
      x-owner: org
      x-action: org.lead.read
      summary: 招生与线索总览（示例数据，业务数字由接口提供）
      parameters:
        - {name: exam, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        "200":
          description: 授权范围内的招生总览
          content:
            application/json:
              schema: {$ref: "#/components/schemas/O02Leads"}
        "403": {$ref: "#/components/responses/Error"}
components:
  schemas:
    O02Leads:
      type: object
      required: [exam_name, data_source, access, sample_sufficient, minimum_group_size, sample_count, summary, leads, channels, campaign, compliance]
      properties:
        exam_name: {type: string}
        data_source: {$ref: "#/components/schemas/DataSource"}
        access: {type: string, enum: [authorized, restricted]}
        sample_sufficient: {type: boolean}
        minimum_group_size: {type: integer, minimum: 1}
        sample_count: {type: integer, minimum: 0}
        summary: {$ref: "#/components/schemas/O02Summary"}
        leads: {type: array, items: {$ref: "#/components/schemas/O02Lead"}}
        channels: {type: array, items: {$ref: "#/components/schemas/O02Channel"}}
        campaign: {$ref: "#/components/schemas/O02Campaign"}
        compliance: {$ref: "#/components/schemas/O02Compliance"}
    O02Summary:
      type: object
      required: [new_leads, followup_due, trial_booked, enrolled, conversion_ratio]
      properties:
        new_leads: {type: integer, minimum: 0}
        followup_due: {type: integer, minimum: 0}
        trial_booked: {type: integer, minimum: 0}
        enrolled: {type: integer, minimum: 0}
        conversion_ratio: {type: number, minimum: 0, maximum: 1}
    O02Lead:
      type: object
      required: [id, name, phone_masked, source, intent, level, status, priority, followup_label, communication]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        phone_masked: {type: string}
        source: {type: string}
        intent: {type: string}
        level: {type: string}
        status: {type: string}
        priority: {type: string, enum: [high, medium, low]}
        followup_label: {type: string}
        communication: {type: string}
    O02Channel:
      type: object
      required: [id, name, leads, trial, enrolled]
      properties:
        id: {type: string}
        name: {type: string}
        leads: {type: integer, minimum: 0}
        trial: {type: integer, minimum: 0}
        enrolled: {type: integer, minimum: 0}
    O02Campaign:
      type: object
      required: [brand, title, description]
      properties:
        brand: {type: string}
        title: {type: string}
        description: {type: string}
    O02Compliance:
      type: object
      required: [sample_text, result, advice]
      properties:
        sample_text: {type: string}
        result: {type: string}
        advice: {type: string}
