# 分期、闭环与黄金路径（ADR-008）。功能所属的闭环只记在这里；功能本身见 roadmap.yaml。
# 受众环写作 ring-0…ring-4，与 release 取值无关。8+ 为主题池，主题内的功能 release 为 later，不预先承诺。
# 切片来自实施步骤表（新编号版）：type 取 eng/probe/view/vert/rule/ai/integ；items 必须由本闭环的功能覆盖；无条目的切片写 carrier。
# 4–7 期的切片为建议稿（suggested: true），期初复核；supplement: true 表示规划原文没有、步骤表补充的切片。
rings:
  - id: ring-0
    audience: 只有开发者本人
    enters_after: 0 期
    gate: []
  - id: ring-1
    audience: 受邀 5–20 人，同一考试，免费
    enters_after: 1 期末
    gate: [手机号登录与协议同意, 数据导出, 报错与反馈通道, 备份恢复演练]
  - id: ring-1+
    audience: 受邀 30–100 人，仍不公开、不收费
    enters_after: 2 期末
    gate: [无人协助的入门, 导师的危机处置与生成标识, 危机值守安排]
  - id: ring-2
    audience: 公开注册，免费
    enters_after: 4 期中
    gate: [未成年人模式, 授权与注销, 内容安全, 客服工单, 容量预案, 备案与协议等外部手续]
  - id: ring-3
    audience: 公开付费
    enters_after: 4 期末
    gate: [支付、退款与发票, 自动续费规则, “核心闭环不设限”的自动化测试]
  - id: ring-4
    audience: 一到三家试点机构
    enters_after: 7 期末
    gate: [租户隔离, 员工账号安全, 数据四分类授权, 审计日志]
phases:
  - id: "0"
    title: 地基与探针
    ring: ring-0
    hypothesis: 技术可行性：证据→档位的规则、记忆调度、AI 解析质量都在可接受范围内；一条最细的端到端链路能跑通。
    audience: 只有你自己。不对外。
    entry: [原型冻结为开发基线（打版本号）, 选定种子考试与内容来源, 客户端形态先做出 ADR]
    exit:
      - 持续集成全绿，预发环境可访问
      - 黄金路径 0 通过（做一题→证据→档位→方格变色）
      - 五份 ADR（证据模型、记忆调度、排程方法、AI 解析结论、客户端形态）
      - 一向门清单逐项有结论
      - 项目记忆文件 v1
    not_doing: [任何后台界面, 正式登录（用固定的开发者账号）, 视觉打磨, 除行走骨架外的任何原型功能]
    metrics: [没有用户指标。只看：探针结论是否明确、黄金路径是否稳定、一次部署要多久]
    budget_rounds: [40, 63]
    loops:
      - id: "0.1"
        title: 工程外壳与约定
        introduces: 工程骨架
        depends: []
        demo: 推一次代码，预发环境自动更新；手机和桌面都能打开学员端外壳。
        budget_rounds: [10, 15]
        fuse_rounds: 22
        not_doing: [任何业务功能, 正式登录, 视觉打磨]
        features: [PLAT-01, PLAT-02, METR-01]
        slices:
          - id: 0.1a
            title: 仓库、目录约定与项目记忆文件
            type: eng
            carrier: docs/meta/doc-system.md
            accept: 新开一个对话，只读 memory.md 就能说清项目在哪一步、下一步做什么、必须遵守哪些规则。
            rounds: [2, 3]
          - id: 0.1b
            title: 持续集成与预发环境
            type: eng
            carrier: .github/workflows/ci.yml
            accept: 提交后自动跑测试并部署；故意提交一个失败测试时流水线变红且不部署。
            rounds: [2, 4]
          - id: 0.1c
            title: 学员端外壳
            type: view
            carrier: PLAT-01
            accept: 手机、平板、桌面三种宽度下导航都可用。
            rounds: [2, 3]
          - id: 0.1d
            title: 通用组件：三态、提议卡与撤销条骨架
            type: view
            carrier: PLAT-01
            accept: 任意页面能一行代码切到空态和出错态；提议卡与撤销条在演示页可交互。
            rounds: [2, 3]
          - id: 0.1e
            title: 参数注册表（一向门）
            type: eng
            carrier: PLAT-02
            accept: 代码里找不到写死的阈值；每个参数都能查到默认值、可调区间与出处。
            rounds: [2, 3]
          - id: 0.1f
            title: 埋点事件表与“有效学习”口径
            type: eng
            carrier: METR-01
            accept: 任何一次作答都会落一条可统计的事件（先用测试中的模拟作答证明）。
            rounds: [2, 3]
        tasks:
          - 0.1a 仓库、目录约定与项目记忆：由文档体系承担，见 docs/meta/doc-system.md
          - 0.1b 持续集成、端到端测试框架与预发环境自动部署：CI 骨架见 .github/workflows/ci.yml
      - id: "0.2"
        title: 领域核心与种子内容
        introduces: 领域模型
        depends: ["0.1"]
        demo: 一条命令导入种子考试：几章、约两百个知识点、几百道题，知识点列表能看到它们。
        budget_rounds: [12, 18]
        fuse_rounds: 27
        not_doing: [作答流程与任何答题界面（0.3 做）, 除只读的知识点列表外的任何界面, 后台界面]
        features: [EXM-01, MAP-01, CONT-01, LRN-01, CONT-02]
        slices:
          - id: 0.2 一向门
            title: 把数据模型相关的一向门写成 ADR
            type: eng
            carrier: [ADR-005, ADR-006, ADR-009, ADR-010, ADR-011, ADR-012, ADR-013, ADR-015, ADR-016]
            accept: 9 份 ADR 都有“决定、为什么现在定、晚定的代价、原型依据、对数据模型的要求”五段。
            rounds: [2, 2]
          - id: 0.2a
            title: 考试画像与知识地图
            type: vert
            carrier: EXM-01
            accept: 换一门评价规则不同的考试，表结构不用改。
            rounds: [3, 4]
          - id: 0.2b
            title: 题目：四级可信度与作答形态
            type: vert
            carrier: CONT-01
            accept: 每道题都能说出它能记多强的证据。
            rounds: [2, 3]
          - id: 0.2c
            title: 证据账本与掌握档派生
            type: rule
            carrier: LRN-01
            accept: 删掉派生表后，一条命令从证据重算出同样的档位。
            rounds: [3, 5]
          - id: 0.2d
            title: 统一词汇常量
            type: eng
            carrier: docs/product/glossary.yaml
            accept: 界面与算法引用同一份常量。
            rounds: [1, 2]
          - id: 0.2e
            title: 种子导入器与两份种子
            type: vert
            carrier: CONT-02
            accept: 一条命令导入种子考试；重复导入不产生重复数据；对照考试的评价规则与主考试不同。
            rounds: [3, 4]
          - id: 0.2f
            title: 预留：数据四分类、机构归属、游客身份
            type: eng
            carrier: [ADR-006, ADR-011, ADR-012]
            accept: 不做任何相关界面，但字段与约束已就位，并有测试证明约束生效。
            rounds: [1, 2]
        tasks:
          - 0.2d 统一词汇常量：以 docs/product/glossary.yaml 的 values 为源，随证据账本功能落地
          - 0.2f 预留字段：数据类别、租户、游客身份随各表结构落地（ADR-006、ADR-011、ADR-012）
      - id: "0.3"
        title: 行走骨架
        introduces: 端到端链路
        depends: ["0.2"]
        demo: 在知识点页做一道题，地图上对应的格子变色。
        budget_rounds: [6, 10]
        fuse_rounds: 15
        golden_path:
          id: GP-0
          path: 在知识点页做一题 → 写入证据 → 档位重算 → 方格变色
        not_doing: [把握度, 解析, 作答形态的完整流程（1.1 做）, 任何视觉打磨]
        features: [PRAC-01]
        slices:
          - id: 0.3a
            title: 知识点页最简版与“做一题”
            type: vert
            carrier: PRAC-01
            accept: 能从知识点进入一道种子题并提交。
            rounds: [2, 3]
          - id: 0.3b
            title: 证据写入与档位按 v0 规则重算
            type: rule
            carrier: PRAC-01
            accept: 提交后证据表多一条，档位按规则变化。
            rounds: [2, 3]
          - id: 0.3c
            title: 方格全景最简版与黄金路径 0
            type: integ
            carrier: PRAC-01
            accept: 自动化测试走完整条链路并断言格子颜色。
            rounds: [2, 3]
      - id: "0.4"
        title: 风险探针
        introduces: 把未知变成 ADR
        depends: ["0.2"]
        demo: 四份探针结论，每份写清结论、证据和放弃的方案。
        budget_rounds: [12, 20]
        fuse_rounds: 30
        not_doing: [任何产品功能, 把探针代码并进产品代码（一律放 spikes/）]
        features: []
        slices:
          - id: 0.4A
            title: 探针 A：证据→档位规则
            type: probe
            carrier: OQ-002
            accept: 规则表里每一行都有一条通过的单元测试。
            rounds: [3, 5]
          - id: 0.4B
            title: 探针 B：记忆调度选型
            type: probe
            carrier: OQ-003
            accept: 选定算法，写明参数默认值与可调区间。
            rounds: [3, 5]
          - id: 0.4C
            title: 探针 C：AI 解析质量
            type: probe
            carrier: OQ-004
            accept: 给出准确率、人工修正量，以及“自建路线”继续或收缩的结论。
            rounds: [3, 5]
          - id: 0.4D
            title: 探针 D：排程启发式
            type: probe
            carrier: OQ-005
            accept: 用种子数据模拟八周，每日任务量不超时间预算。
            rounds: [3, 5]
        tasks:
          - 0.4A 证据→档位规则表：用原型规则写成测试表，结论见 OQ-002
          - 0.4B 记忆调度选型：在模拟数据上比较两三种调度，结论见 OQ-003
          - 0.4C AI 解析质量：教材章节、讲义、往年卷各解析一份，结论见 OQ-004
          - 0.4D 排程启发式：配比、保底、顺延、提议的规则在模拟八周里不崩，结论见 OQ-005
  - id: "1"
    title: 核心日循环
    ring: ring-1
    hypothesis: 一门考试、一个人：每天打开就知道做什么；做完的东西真的算数，复习和错题不会被新学挤掉。
    audience: 5 到 20 位受邀的同一考试考生，免费，没有支付。
    entry: [0 期出口全部满足]
    exit: [黄金路径 1–6 全绿, 受邀用户连续使用两周, 北极星口径的数据可查, 完成一轮“理由可信吗”的访谈, 已知问题里没有阻断级]
    not_doing: [游客模式、自适应诊断、阅读器、AI 导师、模考、支付、任何后台界面、多目标、自建考试与资料导入]
    metrics: [每周有效学习日数、今日清单完成率、巩固段完成率、次日回访率、访谈里“理由可信”的比例。目标值由你在期初写进指标字典]
    budget_rounds: [165, 225]
    loops:
      - id: "1.1"
        title: 练习产生证据
        introduces: 作答流程与证据规则
        depends: ["0.3", "0.4"]
        demo: 在“资产”一章做十题，两道标了“蒙的”；蒙对的那道没升档，地图上几个格子变了色，点进去能看到为什么。
        budget_rounds: [30, 40]
        fuse_rounds: 60
        golden_path:
          id: GP-1
          path: 在“资产”一章做十题，两道标了“蒙的”；蒙对的那道没升档，地图上几个格子变了色，点进去能看到为什么。
        not_doing:
          - 错因确认（1.3）
          - 异题印证（5.6）
          - 变式巩固（1.3）
          - 生成题先做后核（5.6）
          - 讲解与追问（2.6）
          - 报错与处理进度（1.6）
          - 提示阶梯（6.6）
          - 引导式纠错（6.6）等 70 项
          - 本期不做：游客模式
          - 自适应诊断
          - 阅读器
          - AI 导师
          - 模考
          - 支付
          - 任何后台界面
          - 多目标
          - 自建考试与资料导入
        features: [PRAC-02, LRN-02, MAP-02, PRAC-03]
        slices:
          - id: 1.1a
            title: 作答固定流程与把握度
            type: vert
            items: [S18-03, S18-04, S18-01]
            accept: 不选把握度不能提交；揭晓后答案锁定。先只做单选、多选、判断。
            rounds: [4, 5]
          - id: 1.1b
            title: 揭晓：分层解析与“先讲你选的错项”
            type: vert
            items: [S18-06, S18-07]
            accept: 选错时先看到所选项为什么错与陷阱类型，再看结论与知识点回链。
            rounds: [3, 4]
          - id: 1.1c
            title: 证据入账与“档位是怎么算出来的”
            type: rule
            items: [S10-06, S17-05]
            accept: 每次作答生成一条证据；知识点页列出证据与计算依据。
            rounds: [4, 5]
          - id: 1.1d
            title: 待验证规则
            type: rule
            items: [S18-09]
            accept: 标“蒙的”或用时过短的正确作答不升档，进入待验证。
            rounds: [3, 4]
          - id: 1.1e
            title: 方格全景、着色与统计常驻
            type: view
            items: [S09-01, S09-02, S09-04, S09-09]
            accept: 一屏看完整张地图；证据不足画虚线，范围外画斜纹；四个数常驻。
            rounds: [3, 4]
          - id: 1.1f
            title: 知识点主页最小版
            type: view
            items: [S10-01, S10-11, S10-12]
            accept: 阶梯同时标出系统判定与目标档；关联题按“做错的、没做过的、高频的”排。
            rounds: [2, 4]
          - id: 1.1g
            title: 练习入口、纸笔动作、小结与记录
            type: vert
            items: [S17-02, S18-02, S18-05, S18-15, S17-09]
            accept: 从章节或知识点开练；结束有小结；历次记录可回看续做。
            rounds: [3, 5]
      - id: "1.2"
        title: 今日 v0：推进段打通
        introduces: 目标与时间预算、每日任务生成器
        depends: ["1.1"]
        demo: 设好目标日和每天 60 分钟，今天给我四项；做完一项自动进下一项；没做完的明天顺延，并告诉我。
        budget_rounds: [25, 35]
        fuse_rounds: 52
        golden_path:
          id: GP-2
          path: 设好目标日和每天 60 分钟，今天给我四项；做完一项自动进下一项；没做完的明天顺延，并告诉我。
        not_doing:
          - 排序规则（1.4）
          - 短时重组（3.6）
          - 三档降级（3.6）
          - 调整告知与待确认提议（1.5）
          - 断连恢复（1.6）
          - 三个数常驻（3.2）
          - 巩固段（1.3）
          - 收尾段（6.2）等 85 项
          - 本期不做：游客模式
          - 自适应诊断
          - 阅读器
          - AI 导师
          - 模考
          - 支付
          - 任何后台界面
          - 多目标
          - 自建考试与资料导入
        features: [PLAN-01, PLAN-02]
        slices:
          - id: 1.2a
            title: 最小建档：种子考试、目标分、目标日、每日时长
            type: vert
            items: [S02-06, S02-07, S03-03]
            accept: 四个字段填完直接进今日；目标日可标“预计”并写依据。
            rounds: [3, 4]
          - id: 1.2b
            title: 任务生成器 v0 与理由文案
            type: rule
            items: [S06-02, S06-05, S17-01]
            accept: 按地图顺序与时长装箱；理由里的每个数字都来自算法。
            rounds: [4, 5]
          - id: 1.2c
            title: 今日页骨架：倒计时、三段位置、推进段
            type: view
            items: [S06-01, S06-03, S06-14]
            accept: 三段位置都在，本闭环只亮推进段。
            rounds: [2, 3]
          - id: 1.2d
            title: 一键开始与自动串联
            type: vert
            items: [S06-06]
            accept: 点“开始”直达题目，完成后自动接下一项。
            rounds: [2, 3]
          - id: 1.2e
            title: 完成看证据与“全部完成”态
            type: vert
            items: [S06-07, S06-16]
            accept: 手动勾选只记“看过”；做完后显示明天第一件事。
            rounds: [2, 3]
          - id: 1.2f
            title: 夜间顺延与告知
            type: rule
            items: [S07-06]
            accept: 没做完的次日顺延，今日顶部说明顺延了什么。
            rounds: [3, 4]
      - id: "1.3"
        title: 错题回炉
        introduces: 到期队列接口（错题是第一个实现）
        depends: ["1.1", "1.2"]
        demo: 周一做错的题，周四出现在今日巩固段；间隔做对几次、再做对一道变式，它就毕业了。
        budget_rounds: [25, 35]
        fuse_rounds: 52
        golden_path:
          id: GP-3
          path: 做错 → 收录 → 三天后出现在巩固段 → 间隔做对并做对变式 → 毕业
        not_doing: [错因第二层与陷阱画像（6.6）, 拍照导入（5.6）, 导出打印（8 期以后）]
        features: [PRAC-04, PLAN-03, PRAC-05, PRAC-06]
        slices:
          - id: 1.3a
            title: 自动收录与四个状态
            type: vert
            items: [S19-01, S19-03]
            accept: 练习里做错自动进入“新增”。
            rounds: [3, 4]
          - id: 1.3b
            title: 错因确认：七类、无默认、可跳过
            type: vert
            items: [S18-08, S19-06]
            accept: 每类错因对应一种补救动作。
            rounds: [2, 3]
          - id: 1.3c
            title: 到期队列接口与间隔回炉
            type: rule
            items: [S19-04]
            accept: 盲做后按对错与把握度排下次时间，间隔取自参数。
            rounds: [4, 5]
          - id: 1.3d
            title: 毕业规则与变式巩固
            type: rule
            items: [S19-05, S18-11]
            accept: 达标且做对一道变式才毕业；没有变式时提高次数。
            rounds: [3, 4]
          - id: 1.3e
            title: 接入今日巩固段
            type: vert
            items: [S06-13]
            accept: 巩固段有保底占比，新学挤不掉；待验证复核也进巩固段。
            rounds: [2, 4]
          - id: 1.3f
