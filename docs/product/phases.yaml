decision_points:
  - after_phase: "2"
    choose: [A, C, D]
    question: 继续默认路线 A，还是尽早公开或收费（C）、自建先行（D）
  - after_phase: "3"
    choose: [A, B]
    question: 继续默认路线 A，还是机构试点先行（B）
variants:
  - id: A
    title: 默认：学员端先行
    when: 没有确定的机构客户；首要目标是做出真能帮人学会的产品
    change: 按 phases 的顺序
    cost: 收费最晚，要到 4 期末
  - id: B
    title: 机构试点先行
    when: 已有机构愿意付费试点，班上学员考的正是种子考试
    change: 3 期后插入 7.1–7.4 的精简版：单个机构、手工开通、线下结算；4.3 支付后移
    cost: 机构需求会挤占学员端打磨；租户与授权两个一向门要更早落地
  - id: C
    title: 尽早公开或收费
    when: 需要尽快验证付费意愿，或需要公开流量
    change: 2 期后先做 4.1–4.3 与 4.7 中的上线必需项，3 期后移
    cost: 公开版本缺少模考与预测，付费理由偏弱；门槛工作量大，会推迟核心闭环的学习
  - id: D
    title: 自建先行
    when: 目标市场是长尾考试或学校课程期末考
    change: 探针 C（OQ-004）结论为继续时，把 5.2–5.5 提到 2 期之后
    cost: AI 解析的不确定性前移；没有官方地图时预测靠体检锁定兜底，早期能给的数字更少
variant_invariants: [0 期和 1 期不动, 安全随行不打折, 闭环与切片的尺寸标准不变]
risks:
  - risk: 内容使用权
    signal: 种子考试的题、解析、教材找不到合法来源
    prevent: 0 期前确定来源；优先自编解析、官方公开的大纲与真题、已授权内容（OQ-010）
    respond: 换种子考试；阅读器先用自编讲义
  - risk: AI 解析质量不够
    signal: 探针 C 的人工修正量很大
    prevent: 自建路线以手动编辑与模板为主（OQ-004）
    respond: 5 期收缩为模板加手动，自建降级
  - risk: 档位与预测不被信任
    signal: 访谈里说理由看不懂；用户频繁用自评覆盖系统判定
    prevent: “档位是怎么算出来的”可见（S10-06）；只给区间不给单点
    respond: 调规则参数、加强解释；必要时减少数字露出
  - risk: 闭环超预算
    signal: 某个闭环超过预算上限 1.5 倍
    prevent: 闭环写清不做什么；一个闭环只引入一个新核心
    respond: 熔断：剩余切片回到待办，按当前厚度关上（calibration.yaml 记 fused）
  - risk: AI 改坏旧功能
    signal: 黄金路径测试变红
    prevent: 每个闭环留一条黄金路径；切片要小；每次跑全量测试
    respond: 回滚到上一个全绿提交，缩小切片重做
  - risk: 验证要等真实考期
    signal: 3 期功能做完了，却没有成绩回填
    prevent: 1 期就招募考期合适的受邀用户
    respond: 用模拟数据演练流程，真实验证随考期滚动
  - risk: 外部手续拖期
    signal: 备案、商户、授权迟迟不下来
    prevent: 1 期就启动合规轨
    respond: 延长受邀阶段；先开放不涉及受限能力的部分
  - risk: 一个人的带宽
    signal: 同时想做开发、内容和运营
    prevent: 在制品上限为 1；后台用脚本顶替
    respond: 砍范围，而不是延期
  - risk: 数据模型被一门考试带偏
    signal: 加第二门考试时要改表
