[paths]
# 原型冻结（ADR-001）：首次导入后页面登记为源，原型只归档；截图仍从归档原型生成。
prototype_source = "../exam-prep-archive/prototype/prototype-v1.0.html"
prototype_mode = "frozen"          # frozen | editing
archive = "../exam-prep-archive"
merge_history = "../exam-prep-archive/merge-history/import-markers.yaml"
merge_markers = ['（来自[^）]{1,12}）', '【[^】]{0,8}来源[^】]{0,12}】']

[deep_source]              # 页面深化来源（见 5.17），只由 refine-page 读取
prototype = "../exam-prep-archive/deep-source/prototype.html"
refine_list = "../exam-prep-archive/deep-source/refine-list.md"
# E-REFINE-03 扫描的外部编号模式：深化来源的页面号、数据表号、决定号、问题号、章节号与产品名，
# 以及旧模块文档的模块编号与旧项目名（4.1：归档材料不进仓库）。
forbidden_patterns = [
  '(?<![A-Za-z0-9-])[ABCDEFG]-\d+[a-z]?(?![0-9])',
  '(?<![A-Za-z0-9-])(?:ADM|AI-O)-[A-Z0-9_]+',
  '(?<![A-Za-z0-9])L[0-9]-[A-Z0-9]+',
  '(?<![A-Za-z0-9])T\d{2}(?![0-9])',
  '(?<![A-Za-z0-9])D-\d{3}(?![0-9])',
  'T-AI-\d+',
  'ISS-\d+',
  '§\s?\d',
  '(?<![A-Za-z0-9])R1[0-9](?![0-9])',
  '考必[过]',
  '(?<![A-Za-z0-9-])(?:ACC|ACH|AI|CS|EXAM|FSRS|IO|MKT|NOTE|NOTIF|ONB|PAY|QB|QUO|REL|SEARCH|SYS|TREE|TXT)-\d{2}[ab]?(?![0-9])',
]

[budgets]
root_agents_kib = 8
end_agents_kib = 3
pkg_agents_kib = 2
codex_chain_kib = 12
claude_resident_kib = 10
skill_desc_total_chars = 3000
skill_desc_max_chars = 300
rules_concurrent_warn = 60
rules_concurrent_error = 80
convention_rules_max = 15
spec_body_chars = 6000
pack_chars = 15000
pack_slice_chars = 2500

[shots]                    # 各端截图宽度
learner = [375, 834, 1280]   # 834：平板竖屏（ADR-029）
org = [1280]
admin = [1280]
height = 900
quantize = true             # 装有 Pillow 时压成 256 色 PNG

[verify]
# 按技术栈替换。缺 stack_marker 时跳过 pnpm 命令；deps、tooling、results_merge 不依赖安装，总是运行。
# 每次 verify 先删除 results_parts，测试结果只汇总本次运行。
deps = "python3 scripts/engineering/check_dependencies.py"
lint = "pnpm lint"
lint_files = "pnpm exec eslint --no-warn-ignored {files}"
deps_graph = "pnpm deps:graph"
typecheck = "pnpm typecheck"
test = "pnpm test"
# 提交检查（verify --fast）只跑 node 项目的单元测试；数据库与浏览器测试由完整 verify 运行
test_fast = "pnpm test:unit"
tooling = "python3 scripts/engineering/test_results.py tooling"
contract_check = "pnpm contract:check"
e2e_smoke = "pnpm e2e:smoke"
results_merge = "python3 scripts/engineering/test_results.py merge"
results_parts = [".test-results/vitest.json", ".test-results/playwright.json", ".test-results/tooling.json"]
results = ".test-results/results.json"
# 依赖装好后才跑 pnpm 命令
stack_marker = "node_modules/.modules.yaml"

[eval]                     # 评测执行器：可用 {scenario} {suite} {out} 占位；首个 AI 场景接入时填写
runner = ""
records = ".eval"

[git]
main = "main"

[tools]
claude_min_version = "2.1.283"
codex_min_version = "0.124"

[check]
direct_writers = ["planner"]
history_words = ["原来", "改为", "之前", "原方案", "已调整", "调整为", "此前"]
term_scan = ["docs/**/*.md", "apps/**", "packages/ui/**", "design/screens/**/*.yaml"]
term_exclude = ["docs/meta/**", "docs/product/glossary.yaml", "docs/adr/**"]
copy_scan = ["apps/**", "packages/ui/**", "design/screens/**/*.yaml", "docs/product/brief.md"]

[gen]
# 参数登记的数据与类型；访问器 packages/params/index.ts 为手写入口（0.1b）
params_out = "packages/params/registry.generated.ts"
pages_out = "apps/learner/src/generated/pages.ts"
errors_out = "packages/contract/src/generated/error-codes.ts"
permissions_out = "packages/contract/src/generated/permissions.ts"
events_out = "packages/domains/metrics/src/generated/events.ts"
metrics_out = "packages/domains/metrics/src/generated/metrics.ts"
db_models_out = "packages/db/src/generated/models.ts"
tokens_out = "packages/ui/src/generated/tokens.css"
tokens_tailwind_out = "packages/ui/src/generated/tailwind-theme.css"
# 外壳根元素；修饰器按它的 data-<修饰器名> 属性覆盖
tokens_selector = ":root"
# 依赖机构配置的上下文，0 期构建时跳过
tokens_skip_contexts = ["brand.org"]
# 令牌路径前缀=Tailwind 命名空间；末尾 ! 表示写字面值（容器查询不能用变量）
tokens_tailwind_map = ["color=color", "radius=radius", "font.family=font", "font.size=text", "font.line-height=leading", "font.weight=font-weight", "shadow=shadow", "size.breakpoint=container!"]
# Orval 产物（pnpm contract:gen）：目录内的 manifest.json 记录源哈希与各文件哈希，gen --check 据此检出过期与手改
contract_dir = "packages/contract/src/generated/api"
contract_sources = ["contracts/openapi.yaml", "orval.config.ts", "scripts/engineering/contract-gen.mjs"]
contract_cmd = "pnpm contract:gen"
roadmap_out = "docs/product/roadmap.md"
progress_out = "docs/product/progress.md"
